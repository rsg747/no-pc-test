<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>N&amp;O PC Run-and-Grade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: IOS clipboard — sticky teal N&O header with PCWU / PC event chip, step tabs, then Brief · Run (stick diagram + event card) · Grade sheet (RFT form replica) · Debrief & submit. */
:root{
  --bg:#edf1f0; --panel:#ffffff; --panel2:#f5f8f7; --ink:#152120; --muted:#5b6a68; --line:#d2dbd9; --shade:#cfd6d4;
  --brand:#0c4a4f; --brand2:#12646a; --on-brand:#ffffff; --signal:#de7419; --signal-ink:#ffffff;
  --pcwu:#12646a; --pc:#b8560f;
  --ok:#21784a; --okbg:#e3f3ea; --warn:#9a6200; --warnbg:#fdf1d8; --bad:#b0261d; --badbg:#fbe9e7;
  --info:#355d8c; --infobg:#e6eef8; --mute:#6c7776; --mutebg:#e9eded; --focus:#2f6fdb;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="hc"]){
    --bg:#0c1415; --panel:#131f20; --panel2:#182728; --ink:#e2ebea; --muted:#93a4a1; --line:#273839; --shade:#2b3a3b;
    --brand:#0b3b3f; --brand2:#11555a; --signal:#f08f3a; --signal-ink:#1a1206; --pcwu:#3fa3a9; --pc:#f08f3a;
    --ok:#5fcf8f; --okbg:#143223; --warn:#f0c45a; --warnbg:#382c10; --bad:#ff8a80; --badbg:#3a1a18;
    --info:#9cbbe6; --infobg:#18263a; --mute:#9aa6a4; --mutebg:#1e2a2b; --focus:#7aa7ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1415; --panel:#131f20; --panel2:#182728; --ink:#e2ebea; --muted:#93a4a1; --line:#273839; --shade:#2b3a3b;
  --brand:#0b3b3f; --brand2:#11555a; --signal:#f08f3a; --signal-ink:#1a1206; --pcwu:#3fa3a9; --pc:#f08f3a;
  --ok:#5fcf8f; --okbg:#143223; --warn:#f0c45a; --warnbg:#382c10; --bad:#ff8a80; --badbg:#3a1a18;
  --info:#9cbbe6; --infobg:#18263a; --mute:#9aa6a4; --mutebg:#1e2a2b; --focus:#7aa7ff; color-scheme:dark;
}
/* High contrast (default): near-black text on white, darker greys and status colours, heavier body weight */
:root[data-theme="hc"]{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f1f3f3; --ink:#000000; --muted:#232c2b; --line:#6f7d7b; --shade:#b9c2c1;
  --brand:#053438; --brand2:#0a5257; --signal:#c45f0a; --signal-ink:#ffffff; --pcwu:#0a5257; --pc:#9a4508;
  --ok:#0b5a2f; --okbg:#d6efe0; --warn:#6b3f00; --warnbg:#fbe6b8; --bad:#8e140c; --badbg:#f9d9d5;
  --info:#173f6d; --infobg:#d9e6f6; --mute:#2f3837; --mutebg:#e1e6e5; --focus:#1550c0; color-scheme:light;
}
:root[data-theme="hc"] body{font-weight:500}
:root[data-theme="hc"] .why,:root[data-theme="hc"] .small{font-size:15px}
:root[data-theme="hc"] .chip{font-size:13px}
:root[data-theme="hc"] .eyebrow{color:var(--ink)}
:root[data-theme="hc"] .ttl .eyebrow,:root[data-theme="hc"] .ttl .ver{opacity:1}
:root[data-theme="hc"] .card,:root[data-theme="hc"] .gb,:root[data-theme="hc"] .sb{border-color:var(--line)}
:root[data-theme="hc"]{--slate:#2e3a39}
/* High contrast: no dark-on-grey — every grey panel becomes dark slate with white lettering */
:root[data-theme="hc"] .tvbar,:root[data-theme="hc"] .ios,:root[data-theme="hc"] .ofp,:root[data-theme="hc"] .qa .a,
:root[data-theme="hc"] table.rft td.sec,:root[data-theme="hc"] table.rft thead th,:root[data-theme="hc"] .tbl th,
:root[data-theme="hc"] .chip.mute,:root[data-theme="hc"] .req{background:var(--slate);color:#ffffff;border-color:var(--slate)}
:root[data-theme="hc"] .tvbar *,:root[data-theme="hc"] .ios .eyebrow,:root[data-theme="hc"] .ios li,:root[data-theme="hc"] .ios p,:root[data-theme="hc"] .ios .why,
:root[data-theme="hc"] .ofp .eyebrow,:root[data-theme="hc"] .ofp .why,:root[data-theme="hc"] .ofp .muted,:root[data-theme="hc"] .qa .a small{color:#ffffff}
:root[data-theme="hc"] .tvbar .btn,:root[data-theme="hc"] .ios .btn,:root[data-theme="hc"] .ios .showref,:root[data-theme="hc"] .ofp .btn{background:#ffffff;color:#000000;border-color:#ffffff}
:root[data-theme="hc"] .tvbar .btn.primary{background:#de7419;color:#ffffff;border-color:#de7419}
:root[data-theme="hc"] input.note{background:#ffffff}
:root[data-size="lg"] body{zoom:1.15}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3,h4,h5{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.2px;text-wrap:balance}
h2{font-size:30px;line-height:1.1} h3{font-size:22px;margin:24px 0 10px} h4{font-size:19px;margin:0 0 8px}
h5{font-size:14px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px} .grow{flex:1}
.eyebrow{display:block;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:16px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1260px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--signal)}
.brandbar{background:linear-gradient(90deg,#0b1f3f 0%,#12305e 55%,#0b1f3f 100%);border-bottom:3px solid #f2b10c;padding:7px 16px}
.brandbar .inner{display:flex;align-items:center;gap:14px}
.atlaslogo{height:34px;width:auto;display:block}
.brandbar .bb-t{color:#ffffff;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.brandbar .bb-r{margin-left:auto;color:#f2b10c;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em}
@media (max-width:640px){.brandbar .bb-t{display:none}.atlaslogo{height:28px}}
.ttl .eyebrow,:root[data-theme="hc"] .ttl .eyebrow{color:#ffffff !important;opacity:1}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.stamp{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;padding:7px 10px 5px;border-radius:6px;letter-spacing:.5px;background:var(--signal);color:var(--signal-ink)}
.ttl h1{font-size:26px;line-height:1}
.ttl .eyebrow{color:var(--on-brand);opacity:.75;font-size:11px}
.ttl .ver{font-size:12px;color:var(--on-brand);opacity:.9;margin-top:3px;white-space:nowrap}
.ttl .ver button{background:none;border:0;padding:4px 2px;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;min-height:28px}
.ttl .ver .newver{background:#de7419;color:#fff;text-decoration:none;border-radius:999px;padding:3px 10px;margin-left:4px}
.kchip{font-family:var(--f-display);font-weight:700;font-size:18px;padding:2px 10px;border-radius:5px;border:2px solid var(--on-brand)}
.kchip.pc{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.cur{display:flex;flex-direction:column;line-height:1.15;text-align:right}
.cur b{font-family:var(--f-display);font-size:20px} .cur span{font-size:13px;opacity:.85}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.pill.ok::before{content:"● ";color:#7fe0a8}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.demo{background:var(--signal);color:var(--signal-ink);font-weight:700}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--on-brand);border-radius:6px;width:38px;height:38px;cursor:pointer;font-size:18px}
.ghost.dispbtn{width:auto;padding:0 10px;font-size:14px;font-weight:700;white-space:nowrap}
nav.steps{display:flex;gap:4px;overflow-x:auto}
nav.steps button{background:none;border:0;color:var(--on-brand);opacity:.72;padding:10px 14px 9px;font-family:var(--f-display);font-size:18px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.steps button.on{opacity:1;border-bottom-color:var(--signal)}
nav.steps button b{background:var(--bad);color:#fff;border-radius:999px;font-size:12px;padding:0 6px;margin-left:4px;font-family:var(--f-body)}
main{padding-block:22px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 15px;cursor:pointer;min-height:42px;font-weight:600}
.btn:hover{border-color:var(--brand2)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:var(--on-brand)}
.btn.pcb{background:var(--pc);border-color:var(--pc);color:var(--signal-ink)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:4px 11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.oral{background:#3b2a6b;color:#fff} .start.oral{border-top:4px solid #3b2a6b}
.chip.catq{background:#1d4775;color:#fff} .start.catq{border-top:4px solid #1d4775}
.chip.man{background:#5b3a8a;color:#fff} .start.man{border-top:4px solid #5b3a8a}
.manstarts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px} .manstarts .btn{gap:8px} .manstarts .chip{font-size:11px}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)}
.chip.info{background:var(--infobg);color:var(--info)} .chip.mute{background:var(--mutebg);color:var(--mute)}
.chip.pcwu{background:var(--pcwu);color:#fff} .chip.pc{background:var(--pc);color:var(--signal-ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);font-weight:400;font-size:16px;color:var(--ink);width:100%;min-height:42px}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.g2>*{min-width:0}
label.f input,label.f select{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
input[type="date"]{-webkit-appearance:none;appearance:none;min-height:44px;display:block;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand2);color:var(--on-brand)}
.seg small{display:block;font-weight:400;font-size:12px;opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:calc(100% - 32px)}
.mono{font-family:var(--f-mono);font-size:13px}
pre.mono{white-space:pre-wrap;margin:6px 0 0}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px;color:var(--muted)}
details.ref{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.ref summary{padding:12px 16px;cursor:pointer;font-weight:700}
details.ref>div{padding:0 16px 14px}
details.ref ul{margin:0;padding-left:20px}
.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:14px}
.tbl th{font-weight:700;background:var(--panel2)}
.banner{border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:15px}
.banner.warn{background:var(--warnbg);color:var(--warn)} .banner.bad{background:var(--badbg);color:var(--bad)} .banner.info{background:var(--infobg);color:var(--info)} .banner.ok{background:var(--okbg);color:var(--ok)}
.banner b{color:inherit}

/* home */
.intro{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.lede{max-width:70ch;color:var(--muted);margin:8px 0 0}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:90px 1fr auto auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.srow .smain{display:flex;flex-direction:column;min-width:0}
.sact{display:flex;gap:6px}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.start{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.start.pcwu{border-top:5px solid var(--pcwu)} .start.pc{border-top:5px solid var(--pc)}
.start p{margin:0}
.start .btn{align-self:flex-start;margin-top:auto}

/* brief */
.bhead{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.clock .big{font-family:var(--f-mono);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.bar{height:6px;background:var(--mutebg);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar span{display:block;height:100%;background:var(--signal)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.cnt{float:right;font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:600}
ul.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cb{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:6px 4px;cursor:pointer;border-radius:6px;font-size:15px}
.cb:hover{background:var(--panel2)}
.cb .box{flex:none;width:20px;height:20px;border:2px solid var(--line);border-radius:5px;margin-top:1px;display:grid;place-items:center}
.cb.on .box{background:var(--ok);border-color:var(--ok)}
.cb.on .box::after{content:"";width:9px;height:5px;border:2.5px solid var(--panel);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cb.on>span:last-child{color:var(--muted)}
.cb small{display:block;color:var(--muted);font-size:13px}
.cb[disabled]{cursor:default;opacity:.85}
.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 8px;margin-top:4px}
@media (max-width:640px){.evgrid{grid-template-columns:1fr 1fr}}
.docbox{font:inherit;font-size:13px;padding:4px 8px;border:1.5px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);cursor:pointer}
.docbox.x{background:var(--ok);border-color:var(--ok);color:#fff}
.docbox.x::before{content:"☒ "}
.ofps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px}
.ofp{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--brand2);border-radius:8px;padding:14px;min-width:0}
.ofp-h{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:8px}
.ofp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:14px}
.ofp dt{color:var(--muted);font-weight:600} .ofp dd{margin:0;font-family:var(--f-mono);font-size:13px}
.tlr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px;margin-top:8px}
.tlr pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0;font:12px/1.4 var(--f-mono);white-space:pre;overflow-x:auto}
.pilottabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qa{border-top:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.qa .q{font-weight:600}
.qa .a{grid-column:1/-1;font-size:14px;background:var(--panel2);border-radius:6px;padding:6px 10px;white-space:pre-wrap}
.qa .a small{display:block;color:var(--muted)}
.mk{display:inline-flex;gap:4px}
.mk button{border:1px solid var(--line);background:var(--panel);border-radius:6px;min-width:40px;min-height:36px;cursor:pointer;font-weight:700}
.mk button.on.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.mk button.on.bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}

/* run */
.runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.simclock{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px 6px 12px}
.simclock b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stickwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.stick{display:block}
.sk-cap{position:sticky;left:0;display:flex;justify-content:space-between;gap:12px;padding:10px 14px 0;font-family:var(--f-display);font-size:18px;color:var(--muted);flex-wrap:wrap}
.sk-line{fill:none;stroke:var(--brand2);stroke-width:2.5;stroke-linejoin:round}
.sk-axis{stroke:var(--line);stroke-width:1} .sk-time{font:600 11px var(--f-mono);fill:var(--muted)}
.sk-stem{stroke:var(--muted);stroke-width:1;opacity:.5}
.sk-lab{font:600 12px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.sk-ev{cursor:pointer} .sk-ev:focus{outline:none}
.sk-ev:focus-visible .sk-ring{stroke:var(--focus);stroke-width:3}
.sk-ring{fill:none;stroke:var(--line);stroke-width:1.5}
.sk-ev.on .sk-ring{stroke:var(--signal);stroke-width:4}
.sk-ev.on .sk-lab{fill:var(--signal);font-weight:700}
.sk-ev.on .sk-stem{stroke:var(--signal);opacity:1;stroke-width:2}
.sk-ev.crit .sk-lab{fill:var(--bad)}
.h-none{fill:var(--panel2)} .h-ok{fill:var(--ok)} .h-warn{fill:var(--warn)} .h-bad{fill:var(--bad)} .h-info{fill:var(--info)} .h-mute{fill:var(--mute)}
.sk-key{display:flex;gap:12px;flex-wrap:wrap;padding:0 14px 10px;font-size:13px;color:var(--muted)}
.sk-key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.xchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.xchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.xchip.on{border-color:var(--signal);box-shadow:inset 0 0 0 2px var(--signal)}
.xchip svg{flex:none}
.evcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ios{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.ios ul{margin:4px 0 0;padding-left:20px}
.pilots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel);border-top:4px solid var(--brand2);min-width:0}
.pcard.p1{border-top-color:var(--info)}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seat{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--brand2);color:var(--on-brand);border-radius:5px;padding:1px 7px}
.pcard.p1 .seat{background:var(--info)}
.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.st{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 2px;cursor:pointer;font-size:13px;font-weight:700;min-height:42px}
.st.on.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)} .st.on.warn{background:var(--warn);border-color:var(--warn);color:var(--panel)}
.st.on.bad{background:var(--bad);border-color:var(--bad);color:var(--panel)} .st.on.info{background:var(--info);border-color:var(--info);color:var(--panel)}
.st.on.mute{background:var(--mute);border-color:var(--mute);color:var(--panel)}
.reps{display:flex;align-items:center;gap:6px} .reps b{font-family:var(--f-mono);min-width:18px;text-align:center}

/* grade widget */
.gi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.gi.need{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.gi.done{box-shadow:inset 3px 0 0 var(--ok)}
.gi-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gi-h .no{font-family:var(--f-mono);font-weight:600;color:var(--muted);min-width:22px}
.gi-h .nm{font-weight:600;flex:1;min-width:140px}
.gv{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.gb{border:1px solid var(--line);background:var(--panel);border-radius:6px;min-width:42px;min-height:38px;padding:0 8px;cursor:pointer;font:700 15px var(--f-mono)}
.gb.on{color:var(--panel)}
.gb.on.v-S,.gb.on.v-C{background:var(--ok);border-color:var(--ok)}
.gb.on.v-U,.gb.on.v-I{background:var(--bad);border-color:var(--bad)}
.gb.on.v-W{background:var(--info);border-color:var(--info)}
.gb.on.v-sl{background:var(--mute);border-color:var(--mute)}
.gb.rep.on{background:var(--warn);border-color:var(--warn)}
.gsub{display:flex;gap:4px;flex-wrap:wrap}
.sb{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px;font-weight:600;min-height:32px}
.sb.on{background:var(--brand2);border-color:var(--brand2);color:var(--on-brand)}
.why{font-size:13px;color:var(--muted)}
.qg summary{cursor:pointer;font-size:17px;list-style-position:outside}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.qgrid .eyebrow{margin-bottom:4px}
.aimsload{background:#0b1f3f;color:#fff;border-color:#0b1f3f;font-weight:700}
.aimsload small{font-weight:700;opacity:.85;color:#f2b10c}
.sdbtn{border-color:#c98a1f;color:#6b3f00;background:#fffaf0;font-weight:700}
.sdbtn.has{background:#fde9c4;border-color:#b07410}
.sdlist{margin:0;padding-left:22px} .sdlist li{display:flex;gap:10px;align-items:flex-start;border:1px solid #e3c98d;background:#fffaf2;border-radius:8px;padding:8px 10px;margin-bottom:6px;color:#111}
.sdlist .sd-t{font-size:13px;color:#5a4a30;white-space:nowrap;margin-top:2px} .sdlist .sd-x{flex:1;white-space:pre-wrap}
.wvtag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--mutebg);color:var(--mute);white-space:nowrap}
.wvtag.ok{background:var(--infobg);color:var(--info)} .wvtag.lock{background:var(--badbg);color:var(--bad)}
.why.bad{color:var(--bad)} .why.cr{color:var(--ok)}
.req{font:700 11px var(--f-mono);border-radius:4px;padding:1px 5px;background:var(--mutebg);color:var(--mute)}
.req.R{background:var(--badbg);color:var(--bad)} .req.W{background:var(--infobg);color:var(--info)} .req.C{background:var(--okbg);color:var(--ok)}
.sym{font-size:12px;font-weight:700;color:var(--info)}
input.note{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel2);font-size:14px;width:100%;color:var(--ink)}

/* grade sheet (RFT form) */
.formhdr{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.formhdr>div{background:var(--panel);padding:8px 10px;min-width:0;flex:1 1 230px}
.formhdr .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.formhdr .v{font-weight:600;overflow-wrap:anywhere}
.boxes{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px}
.boxes span::before{content:"☐ ";color:var(--muted)} .boxes span.x{font-weight:700} .boxes span.x::before{content:"☒ ";color:var(--ink)}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:14px;align-items:start}
table.rft{border-collapse:collapse;width:100%;background:var(--panel);border:1.5px solid var(--ink)}
table.rft th,table.rft td{border:1px solid var(--line);padding:5px 6px;font-size:14px;vertical-align:middle}
table.rft thead th{background:var(--panel2);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
table.rft td.sec{background:var(--shade);font-weight:700;text-align:center;font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
table.rft td.c{width:62px;text-align:center;font:700 16px var(--f-mono);cursor:pointer}
table.rft td.c.sh{background:var(--shade);cursor:default}
table.rft td.c.miss{background:var(--badbg);color:var(--bad)}
table.rft td.c.auto{color:var(--muted);font-weight:400}
table.rft td.c.v-U,table.rft td.c.v-I{color:var(--bad)}
table.rft td.c.v-W{color:var(--info)}
table.rft td.c.ro{cursor:default}
table.rft tr.sel td{background:var(--infobg)}
table.rft td.n{width:30px;font-family:var(--f-mono);color:var(--muted)}
table.rft td .det{display:block;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0}

/* debrief */
ul.probs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.probs li{border-left:3px solid var(--bad);background:var(--badbg);padding:6px 10px;border-radius:4px;font-size:15px;cursor:pointer}
ul.probs li.w{border-left-color:var(--warn);background:var(--warnbg)}
ul.probs li b{font-family:var(--f-mono)}
.carry{display:flex;flex-wrap:wrap;gap:6px}

/* reference pop-up */
.refmodal{position:fixed;inset:0;z-index:40;background:rgba(10,20,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.pdfov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
.pdfov[hidden]{display:none}
.pdfbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--brand);color:var(--on-brand);padding:10px 12px;border-radius:12px 12px 0 0}
.pdfbar b{font-family:var(--f-display);font-size:20px;flex:1;min-width:160px}
.pdfbar .btn{min-height:44px;font-size:17px;font-weight:700;background:#ffffff;color:#0c1415;border:1px solid #ffffff}
.pdfbar .btn.primary{background:#de7419;color:#ffffff;border-color:#de7419}
.pdfbody{flex:1;background:#fff;border-radius:0 0 12px 12px;overflow:auto;-webkit-overflow-scrolling:touch}
.pdfbody iframe{border:0;width:100%;height:100%;display:block}
.pdfbody .pdfnote{padding:10px 14px;font-size:15px;color:#222;background:#fff6e5;border-bottom:1px solid #e3c98d}
.refbox{background:var(--panel);color:var(--ink);border-radius:12px;max-width:760px;width:100%;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.refbody{font-size:15px} .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px} .shots img{width:100%;border-radius:8px;border:1px solid var(--line)} .refbody ul{margin:0;padding-left:20px} .refbody li{margin:4px 0}
li.chkrow{display:flex;align-items:flex-start;gap:4px}
li.chkrow .cb{flex:1}
.showref{flex:none;border:1px solid var(--line);background:var(--infobg);color:var(--info);border-radius:999px;font-size:13px;font-weight:700;padding:3px 10px;margin-top:5px;cursor:pointer;min-height:30px}
/* presenter (TV) */
.pres{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pres img{max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;display:block}
.pres .tapL,.pres .tapR{position:absolute;top:0;bottom:0;width:30%;z-index:1}
.pres .tapL{left:0} .pres .tapR{right:0}
.pres .pbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;gap:8px;align-items:center;background:rgba(20,30,30,.88);border-radius:14px;padding:8px 10px;transition:opacity .25s;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
.pres .pbar.hide{opacity:0;pointer-events:none}
.pres .pbar button{background:#2b3b3c;color:#fff;border:0;border-radius:9px;min-height:46px;min-width:56px;padding:0 14px;font:600 17px var(--f-body);cursor:pointer}
.pres .pbar button.rev{background:var(--signal);color:var(--signal-ink)}
.pres .pbar button:disabled{opacity:.35}
.pres .pbar .ct{font:600 15px var(--f-mono);padding:0 6px;color:#cfd8d7}
.pres .msg{font:600 22px var(--f-body);color:#cfd8d7;text-align:center;padding:24px}
.tvbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--infobg);color:var(--info);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.tvbar .btn{color:var(--ink)}
.qa .tv{min-width:40px;min-height:36px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer}
@media (max-width:860px){
  .bhead{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr auto}
  .srow .scode,.srow .sact{grid-column:1/-1}
  .cur{display:none}
  table.rft td.c{width:48px}
}
@media (max-width:520px){
  .sts{grid-template-columns:repeat(3,1fr)}
  h2{font-size:26px}
  .ttl .eyebrow{display:none}
  .ttl h1{font-size:20px} .stamp{font-size:20px;padding:5px 8px 3px} .brandrow{gap:8px;padding-block:6px}
}

function gustHTML(id){

  const sim = simById(id) || (s && simById(s.setup.sim));
  const pick = `<div class="row" style="margin:0 0 10px"><span class="eyebrow">Simulator</span>${SIMS.map(x => `<button class="sb ${sim && sim.id===x.id?"on":""}" data-act="ref" data-v="gust:${x.id}">${esc(x.name)} · ${esc(x.faa)}</button>`).join("")}</div>`;
  const pcwu = isPCWU ? `<p class="banner warn" style="margin:0 0 10px"><b>PCWU is a training event:</b> keep the FAA Gust model. The device setups below are for evaluation events (PCs and type ratings) only.</p>` : "";
  const body = sim ? `<h4 style="margin:4px 0">${esc(sim.name)} (#${esc(sim.faa)}) · ${esc(sim.loc)}</h4>
    <div class="cols" style="margin-top:6px"><div><h5>Required setup (evaluation events)</h5>${ul(sim.need)}</div><div><h5>IOS setup procedure</h5><ol style="margin:0;padding-left:20px">${sim.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div></div>
    ${sim.note ? `<p class="why">${esc(sim.note)}</p>` : ""}
    <h5>Reference screenshots</h5><div class="shots">${sim.shots.map(f => `<img src="setup/gust/${f}.jpg" alt="${esc(sim.name)} IOS screen" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'why',textContent:'Screenshot not available in this copy.'}))">`).join("")}</div>`
    : `<p class="why">Choose the simulator above (or set it in Setup) to see its setup.</p>`;
  return pcwu + pick + body + `<div class="cols" style="margin-top:10px"><div><h5>Do</h5>${ul(["Follow the device-specific setups exactly","Confirm setup matches the published configuration prior to starting the maneuver","Provide feedback to Training (Al Cortes) and Standards (John Schumacher) on issues, inconsistencies, or improvements"])}</div><div><h5>Do not</h5>${ul(["Use any other gust setup for evaluation","Modify wind setups beyond defined configurations","Assume setups are transferable between devices","Experiment with alternate wind setups during an evaluation event"])}</div></div>`;
}

REFS.revs = {h:"Revision history", src:"N&O PCWU · PC Run-and-Grade · v" + APP_VERSION, html:() => REVISIONS.map(r => `<h4 style="margin:12px 0 4px">v${esc(r.v)} <span class="muted small">${esc(r.d)}</span></h4><ul>${r.n.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`).join("")};
const inClaudeApp = () => !!(window.claude && window.claude.use);
let newerVer = "";
async function latestVersion(){
  const r = await fetch(location.pathname + "?chk=" + Date.now(), {cache:"no-store"}); if (!r.ok) throw new Error("HTTP " + r.status);
  const m = (await r.text()).match(/const APP_VERSION = "([^"]+)"/); return m ? m[1] : "";
}
function reloadNewest(){
  try { if (window.top !== window && window.top.location.pathname) { window.top.location.replace(window.top.location.pathname + "?v=" + Date.now()); return; } } catch(e){}
  location.replace(location.pathname + "?v=" + Date.now());
}
async function checkUpdates(manual){
  if (inClaudeApp()) { if (manual) location.reload(); return; }
  if (manual) toast("Checking for updates…");
  try { const v = await latestVersion();
    if (v && v !== APP_VERSION) { newerVer = v; renderHeader(); if (manual) { toast(`Updating to v${v}…`); setTimeout(reloadNewest, 500); } }
    else if (manual) toast(`You have the newest version (v${APP_VERSION})`);
  } catch(e){ if (manual) toast(navigator.onLine === false ? "No internet — can't check for updates" : "Couldn't check: " + e.message); }
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = Date.now(); else if (Date.now() - hiddenAt > 60000) checkUpdates(false); });
setTimeout(() => checkUpdates(false), 4000);
function closeRef(){ const m = $("refModal"); m.hidden = true; m.innerHTML = ""; }
