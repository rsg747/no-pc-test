   : `<p class="muted small" style="margin:4px 0">${(s.setup.pilots[p].emp||"").trim() ? "No PCWU found for this employee number in the store or on this device." : "Enter the employee number to find this pilot’s PCWU."} Import a PCWU .json file if it was done on another device.</p>`}
   <div class="row" style="margin-top:6px"><button class="btn small" data-act="import" data-p="${p}">Import PCWU file</button></div></div>`;
}
function carryChips(s,p){
  return ITEMS.filter(it => it.cred || it.naf).map(it => { const r = req(s,p,it.n);
    if (r.na) return "";
    if (r.credited) return `<span class="chip ok" title="${esc(r.cwhy)}">${it.n} ✓</span>`;
    if (r.code === "/") return "";
    return `<span class="chip bad" title="${esc(r.cwhy||r.why)}">${it.n} do on PC</span>`; }).join(" ");
}

function docsCard(s){

function oralCard(s){

  const tally = p => { const a = s.brief.oral[p] || {}; const v = Object.entries(a).filter(([k]) => k.startsWith(bank.bank+":")).map(([,x])=>x); return {c:v.filter(x=>x==="c").length, x:v.filter(x=>x==="x").length}; };

   <div class="row"><span class="eyebrow">Question bank</span><div class="seg">${ORAL.map(b=>`<button class="${b.bank===bank.bank?"on":""}" data-act="bank" data-v="${b.bank}">${b.bank}</button>`).join("")}</div>
   <select class="in" style="width:auto" id="f_topic" data-act-change="topic"><option value="">All topics (${bank.qs.length})</option>${topics.map(t=>`<option ${ui.oralTopic===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
   <span class="grow"></span>${[0,1].map(p => { const t = tally(p); return `<span class="chip ${t.x?"warn":"ok"}">${esc(pname(s,p))}: ${t.c} ✓ · ${t.x} ✗</span>`; }).join(" ")}</div>

function renderBrief(s){

}
function docsCardPCWU(s){ return `<h3>Documents to be checked</h3><p class="muted small" style="margin-top:0">Pilot certificate / license, valid medical, FCC radio operator’s permit, government ID, FTSP photo if required. Recorded on the PC; check them now to catch problems a day early.</p>${docsCard(s).replace("<h3>Documents</h3>","")}`; }

/* ============================================================ RUN */
function halfDisc(cx, cy, r, c0, c1){
  return `<path d="M${cx} ${cy-r} A${r} ${r} 0 0 0 ${cx} ${cy+r} Z" class="h-${c0}"/><path d="M${cx} ${cy-r} A${r} ${r} 0 0 1 ${cx} ${cy+r} Z" class="h-${c1}"/><circle cx="${cx}" cy="${cy}" r="${r}" class="sk-ring"/><line x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy+r}" stroke="var(--panel)" stroke-width="1.5"/>`;
}
function stick(s){
  const evs = EVENTS(s).filter(e => !e.opt), path = PATH(s);
  const maxX = Math.max(...path.map(p=>p[0])) + 4, maxY = s.kind==="PCWU" ? 16 : 24;
  const W = 1240, H = 350, L = 40, R = 20, T = 120, B = 34;
  const X = t => L + (t/maxX)*(W-L-R), Y = a => H - B - (a/maxY)*(H-T-B);
  const pts = path.map(([t,a]) => `${X(t).toFixed(1)},${Y(a).toFixed(1)}`).join(" ");
  const ticks = []; for (let t=0; t<=maxX; t+=15) ticks.push(t);
  const NL = 5, last = Array(NL).fill(-999);
  const marks = evs.map((e,i) => {
    const cx = X(e.x), cy = Y(e.y), lab = e.s || e.t, hw = lab.length*3.4 + 6;
    let lane = last.findIndex(r => cx - hw > r); if (lane < 0) lane = i % NL;
    last[lane] = cx + hw;
    const ly = 18 + lane*20;
    const c0 = evState(s,e,0), c1 = evState(s,e,1);
    return `<g class="sk-ev ${ui.ev===e.id?"on":""} ${e.crit?"crit":""}" data-act="ev" data-v="${e.id}" tabindex="0" role="button" aria-label="${esc(e.t)}">
      <line class="sk-stem" x1="${cx}" y1="${ly+4}" x2="${cx}" y2="${cy-12}"/>
      <text class="sk-lab" x="${Math.min(Math.max(cx, L+hw-6), W-R-hw+6)}" y="${ly}" text-anchor="middle">${esc(lab)}</text>
      ${halfDisc(cx,cy,11,c0,c1)}</g>`; }).join("");
  return `<div class="stickwrap"><div class="sk-cap"><span>${s.kind==="PCWU" ? "747 Recurrent PCWU (FFSQ-1)" : esc(CAT(s.setup.cat).label)+" profile"}</span><span class="eyebrow">Tap an event · left half ${esc(pname(s,0))} · right half ${esc(pname(s,1))}</span></div>
   <svg class="stick" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Flight profile">
    <line class="sk-axis" x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}"/>
    ${ticks.map(t => `<line class="sk-axis" x1="${X(t)}" y1="${Y(0)}" x2="${X(t)}" y2="${Y(0)+5}"/><text class="sk-time" x="${X(t)}" y="${Y(0)+20}" text-anchor="middle">${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}</text>`).join("")}
    <polyline class="sk-line" points="${pts}"/>${marks}</svg>
   <div class="sk-key">${s.kind==="PCWU" ? TSTAT.map(x=>`<span><i class="h-${x.c}" style="background:var(--${x.c})"></i>${x.l}</span>`).join("") : `<span><i style="background:var(--ok)"></i>Graded S / C</span><span><i style="background:var(--warn)"></i>Partly graded</span><span><i style="background:var(--bad)"></i>U / I</span><span><i style="background:var(--mute)"></i>Credited / waived / not required</span><span><i style="background:var(--panel2);border:1px solid var(--line)"></i>Not yet</span>`}<span style="color:var(--bad)">Red label = critical maneuver</span></div></div>`;
}
function xchips(s){
  const opt = EVENTS(s).filter(e => e.opt);
  const lab = s.kind==="PCWU" ? "Optional maneuvers & SPOTs" : "Only if not credited on the PCWU · general items";
  return `<div class="xchips"><span class="eyebrow">${lab}</span>${opt.map(e => { const need = s.kind==="PC" && evNeeded(s,e);
    return `<button class="xchip ${ui.ev===e.id?"on":""}" data-act="ev" data-v="${e.id}"><svg width="22" height="22" viewBox="0 0 22 22">${halfDisc(11,11,9,evState(s,e,0),evState(s,e,1))}</svg>${esc(e.t)}${s.kind==="PC" ? (need ? ` <span class="chip bad">needed</span>` : ` <span class="chip mute">done / not needed</span>`) : ""}</button>`; }).join("")}</div>`;
}
function gradeWidget(s,p,n){
  const it = IT(n), g = (s.g[p]||{})[n] || {};
  if (s.kind === "PCWU") {
    const c = pcwuCell(s,p,n);
    if (c.shaded) return "";
    const subs = it.subs && (n===21||n===14||n===15) ? `<div class="gsub">${it.subs.map(([k,l]) => `<button class="sb ${(g.subs||{})[k]?"on":""}" data-act="sub" data-p="${p}" data-n="${n}" data-v="${k}">${esc(l)}</button>`).join("")}</div>` : "";
    return `<div class="gi ${c.val?"done":""}"><div class="gi-h"><span class="no">${n}</span><span class="nm">${esc(it.t)}</span>${it.cred?`<span class="sym">✈ creditable</span>`:""}${it.naf?`<span class="sym">Non-App F</span>`:""}</div>
      ${c.auto ? `<p class="why">“/” — ${esc(c.why)}</p>` : `<div class="gv">${pcwuAllowed(s,p,n).map(v => `<button class="gb v-${v==="/"?"sl":v} ${g.st===v?"on":""}" data-act="g" data-p="${p}" data-n="${n}" data-v="${v}">${v}</button>`).join("")}<span class="why">${it.naf ? "C complete · / not observed · blank = not proficient (do on PC)" : "S = proficient, credit toward PC · blank = do on PC"}</span></div>`}
      ${(n===14||n===15) && s.setup.conductor.role!=="SCP" ? `<p class="why bad">CAT II/III certification requires a Check Pilot to grade.</p>` : ""}
      ${subs}${NAF_NOTE[n]?`<p class="why">${esc(NAF_NOTE[n])}</p>`:""}</div>`;
  }
  const r = req(s,p,n), v = eff(s,p,n), auto = isAuto(s,p,n), A = allowed(s,p,n);

  const subs = it.subs ? `<div class="gsub">${it.subs.map(([k,l]) => `<button class="sb ${(g.subs||{})[k]?"on":""}" data-act="sub" data-p="${p}" data-n="${n}" data-v="${k}">${esc(l)}</button>`).join("")}</div>` : "";
  const reqTag = r.na ? `<span class="req">N/A</span>` : r.credited ? `<span class="req C">PCWU credit</span>` : `<span class="req ${r.code==="W"||r.code==="T"?"W":r.code==="/"?"":"R"}" title="${esc(CODE_LABEL[r.code]||"")}">${r.code==="R"?"Required":r.code==="W"?"Waivable":r.code==="T"?"T/O stall req":r.code==="/"?"Not required":"Required"}</span>`;
  return `<div class="gi ${need?"need":"done"}"><div class="gi-h"><span class="no">${n}</span><span class="nm">${esc(it.t)}</span>${it.wv?`<span class="sym" title="Waiver authority">★</span>`:""}${it.cred?`<span class="sym" title="Creditable during PCWU">✈</span>`:""}${reqTag}</div>
   <div class="gv">${A.map(x => `<button class="gb v-${x==="/"?"sl":x} ${v===x?"on":""} ${v===x&&auto?"auto":""}" data-act="g" data-p="${p}" data-n="${n}" data-v="${x}" ${r.na?"disabled":""}>${g.rep && x==="S" ? "S · repeat passed" : g.rep && x==="U" ? "U · repeat failed" : x}</button>`).join("")}</div>
    ${!it.naf && !r.na ? `<div class="gv"><span class="why">${g.rep ? "Repeated — first attempt failed for:" : "First attempt failed? Repeat reason:"}</span>${[["A","Systems knowledge"],["B","Control tech / execution"],["C","Procedural error"]].map(([x,l]) => `<button class="sb ${g.rep===x?"on":""}" data-act="rep" data-p="${p}" data-n="${n}" data-v="${x}">${x} · ${l}</button>`).join("")}</div>` : ""}
   ${r.credited ? `<p class="why cr">✓ ${esc(r.cwhy)}${g.st?" — re-evaluated on PC":""}</p>` : r.cwhy ? `<p class="why bad">${esc(r.cwhy)}</p>` : ""}
   ${r.lock && it.wv ? `<p class="why bad">🔒 ${esc(r.lock)}</p>` : ""}
   ${n===21 ? `<p class="why">${r.code==="R" ? "T/O (in turn), LDG and Clean all required." : "T/O config stall in a 15–30° turn required; LDG and Clean may be waived."}</p>` : ""}
   ${n===9 && v==="W" && (s.setup.pilots[p].duty==="FO") ? `<p class="why bad">FO RTO — judgment standard; not automatically waived.</p>` : ""}
   ${g.rep ? `<p class="why">Repeat recorded (code ${g.rep}). Train first, then repeat once: grade S if the repeat passes, U if it fails.</p>` : ""}
   ${subs}
   <input class="note" id="note_${p}_${n}" data-k="g/${p}/${n}/note" value="${esc(g.note||"")}" placeholder="${v==="U"||v==="I"||g.rep ? "Remark required — brief and specific (e.g. deviation exceeded one dot)" : "Note"}"></div>`;
}
function renderRun(s){
  const E = EVENTS(s); if (!ui.ev || !E.find(e => e.id === ui.ev)) ui.ev = E[0].id;
  const e = E.find(x => x.id === ui.ev), i = E.indexOf(e);

       <div class="reps"><span class="small muted">Repeats</span><button class="btn small" data-act="treps" data-p="${p}" data-v="-1">−</button><b>${r.reps||0}</b><button class="btn small" data-act="treps" data-p="${p}" data-v="1">+</button></div>` : "";
    const restricted = seatRestricted(s,p);
    return `<div class="pcard p${p}"><div class="ph"><span class="seat">${seatLab(p)}</span><b>${esc(pname(s,p))}</b><span class="muted small">${esc(s.setup.pilots[p].duty)} · as PF</span></div>
      ${restricted ? `<p class="banner bad" style="margin:0">Unsatisfactory item recorded. This pilot may not occupy any crew seat or give seat support for the rest of the session.</p>` : ""}
      ${train}
      ${e.items.map(n => gradeWidget(s,p,n)).join("")}
      ${s.kind==="PCWU" ? `<input class="note" id="enote_${e.id}_${p}" data-k="run/ev/${e.id}/p/${p}/note" value="${esc(r.note||"")}" placeholder="Training note">` : ""}</div>`;
  };
  return `<div class="runbar"><div class="simclock"><span class="eyebrow">Sim</span><b id="simClock">${fmtDur(el)}</b><button class="btn small ${s.run.startedAt?"":"primary"}" data-act="rtimer">${s.run.startedAt?"Pause":"Start"}</button></div>
    ${s.kind==="PC" ? [0,1].map(p => `<span class="chip ${blocking(s,p).length?"warn":"ok"}">${esc(pname(s,p))}: ${ITEMS.filter(it=>!eff(s,p,it.n)).length} items open</span>`).join("") : `<span class="muted small">PCWU target 4:30 · ${s.setup.conductor.role==="SCP"?"SCP — ✈ credit available":"Instructor — no ✈ credit"}</span>`}
    <span class="grow"></span><span class="muted small">Order of events is SCP discretion — grade whatever was flown.</span></div>
   ${stick(s)}${xchips(s)}
   <div class="evcard"><div><span class="eyebrow">${e.opt ? (s.kind==="PCWU" ? "Optional" : "As required") : `Event ${i+1}`}${e.crit?" · critical":""}</span><h2>${esc(e.t)}</h2></div>
    ${e.ios && e.ios.length ? `<div class="ios"><span class="eyebrow">Script / IOS</span><ul>${e.ios.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${!e.items.length && s.kind==="PC" ? "" : ""}
    <div class="pilots">${pcard(0)}${pcard(1)}</div>
    ${s.kind==="PC" ? logBox(s) : ""}
    <div class="row" style="justify-content:space-between"><button class="btn" data-act="step" data-v="-1" ${i===0?"disabled":""}>← Previous</button><button class="btn primary" data-act="step" data-v="1" ${i===E.length-1?"disabled":""}>Next →</button></div></div>`;
}
function logBox(s){

   <div class="cols">${[0,1].map(p => `<div><b>${esc(pname(s,p))}</b><ul class="small">${s.log[p].map(x=>`<li><span class="mono">${esc(x.t)}</span> ${esc(x.m)}</li>`).join("") || "<li class='muted'>No entries</li>"}</ul>

/* ============================================================ GRADE SHEET */
function sheetCell(s,p,n,col){
  const it = IT(n);
  if (col === "pcwu") {
    if (s.kind === "PCWU") { const c = pcwuCell(s,p,n); if (c.shaded) return `<td class="c sh"></td>`; return `<td class="c ${c.auto?"auto":""} ro">${c.val||""}</td>`; }
    const L = pcwuOf(s,p); if (!(it.cred||it.naf)) return `<td class="c sh"></td>`;
    return `<td class="c ro auto">${L ? ((L.items[n]||{}).st || "") : ""}</td>`;
  }
  if (col === "rep") { if (s.kind === "PCWU" || it.naf) return `<td class="c sh"></td>`; const g = (s.g[p]||{})[n]||{}; return `<td class="c ro">${g.rep||""}</td>`; }
  if (s.kind === "PCWU") return `<td class="c sh"></td>`;
  const v = eff(s,p,n), auto = isAuto(s,p,n);
  return `<td class="c ${!v?"miss":""} ${auto?"auto":""} v-${v==="/"?"sl":v}" data-act="sel" data-v="${n}" title="${esc(req(s,p,n).why||"")}">${v || "?"}</td>`;
}
function subLine(s,p,n){
  const it = IT(n), g = (s.g[p]||{})[n] || {}; if (!it.subs) return "";
  const on = it.subs.filter(([k]) => (g.subs||{})[k]).map(([,l]) => l);
  return on.length ? `<span class="det">☒ ${esc(on.join(" · "))}</span>` : "";
}
function renderSheet(s){

  return `<span class="eyebrow">Pilot Training / Check Grade Sheet · TC_PC_RFT_REC</span><h2>${isPC ? "PC grade sheet" : "PCWU column"}</h2>
   <div class="pilottabs" style="margin-top:10px">${[0,1].map(i => `<button class="btn ${ui.p===i?"primary":""}" data-act="pilot" data-v="${i}">${esc(pname(s,i))} · ${esc(s.setup.pilots[i].duty)}</button>`).join("")}</div>
   ${isPC && !L && ["REC","RQF","RQ12"].includes(s.setup.cat) ? `<div class="banner warn">No PCWU linked for this pilot — every ✈ item, CAT II/III and Non-Appendix F maneuver must be graded on the PC. Link it in Setup.</div>` : ""}
   ${seatRestricted(s,p) ? `<div class="banner bad">Unsatisfactory item recorded — seat restriction applies for the remainder of the session.</div>` : ""}
   <div class="formhdr">
    <div><div class="k">Name of airman · Employee no.</div><div class="v">${esc(P.name||"—")} · ${esc(P.emp||"—")}</div></div>
    <div><div class="k">CA / FO · A/C type</div><div class="v">${esc(P.duty)} · ${esc(P.acType)}</div></div>
    ${isPC ? `<div><div class="k">Certificate · Airman cert no.</div><div class="v">${esc(P.cert)} · ${esc(P.certNo||"—")}</div><div class="boxes">${box((s.docs[p]||{}).eng,"English Proficient")}</div></div>
    <div><div class="k">Medical date · class</div><div class="v">${esc(P.medDate||"—")} · First</div><div class="boxes">${box((s.docs[p]||{}).fcc,"FCC Permit")}${box((s.docs[p]||{}).photo,"Photo ID")}</div></div>` : ""}
    <div><div class="k">Simulator ID # (PCWU / PC)</div><div class="v">${isPC ? `${esc(L?L.device:"—")} / ${esc(s.setup.device||"—")}` : esc(s.setup.device||"—")}</div></div>
    <div><div class="k">TO / LDGs (3 min) · Times</div><div class="v">${isPC ? `<span class="row"><input class="in" style="width:70px;min-height:34px" id="to_${p}" data-k="counts/${p}/to" value="${esc(s.counts[p].to)}" inputmode="numeric" aria-label="Takeoffs"> / <input class="in" style="width:70px;min-height:34px" id="ldg_${p}" data-k="counts/${p}/ldg" value="${esc(s.counts[p].ldg)}" inputmode="numeric" aria-label="Landings"></span>` : ""}PCWU ${isPC ? esc(L?L.time:"—") : pcTime} · ${isPC?`PC ${pcTime}`:""}</div></div>

   <div class="sheet"><div class="scroll"><table class="rft">${head}<tbody>${rows(left)}</tbody></table></div><div class="scroll"><table class="rft">${head}<tbody>${rows(right)}</tbody></table></div></div>

}

/* ============================================================ DEBRIEF */
function renderDebrief(s){
  const isPC = s.kind === "PC";
  const pcol = p => { const pr = problems(s,p), bl = pr.filter(x=>!x.warn), d = s.debrief.p[p];
    const runs = EVENTS(s).map(e => ({e, r:(((s.run.ev[e.id]||{}).p)||[])[p]||{}})).filter(x => x.r.st || x.r.note);
    return `<div class="card"><div class="ph"><span class="seat" style="background:${p?"var(--info)":"var(--brand2)"};color:#fff">${seatLab(p)}</span><h4 style="margin:0">${esc(pname(s,p))}</h4><span class="muted small">${esc(s.setup.pilots[p].duty)} · emp ${esc(s.setup.pilots[p].emp||"—")}</span></div>
     ${seatRestricted(s,p) ? `<div class="banner bad" style="margin-top:10px">Unsatisfactory — no crew seat or seat support for the rest of the session. Complete the failure documentation and notify company personnel per the FOTM.</div>` : ""}

async function doExport(kind){

    toast("File export isn't available in this view."); return; }

function importFile(file, p){

    let r; try { r = JSON.parse(rd.result); } catch(e){ toast("That file isn't a valid .json record."); return; }
    if (!r || r.schema !== SCHEMA || !r.id) { toast("Not an N&O PC / PCWU record."); return; }
    migrate(r); delete r.demo;
    if (!sessions[r.id] || (r.updatedAt||0) > (sessions[r.id].updatedAt||0)) { sessions[r.id] = r; touch(r); }
    const s = cur();
    if (p != null && s && s.kind === "PC" && r.kind === "PCWU") {
      const P = s.setup.pilots[p]; let i = r.setup.pilots.findIndex(x => (x.emp||"").trim() && x.emp.trim() === (P.emp||"").trim());

}

const deckCache = {};

async function loadDeck(deck){
  if (deckCache[deck]) return deckCache[deck];
  const r = await fetch(`decks/${deck}.json`); if (!r.ok) throw new Error("HTTP " + r.status);
  return deckCache[deck] = await r.json();
}
async function openPresent(deck, startIdx, list){

  const el = $("pres"); el.hidden = false; el.innerHTML = `<div class="msg">Loading slides…</div>`;
  try { const fs = el.requestFullscreen || el.webkitRequestFullscreen; if (fs) fs.call(el).catch?.(() => {}); } catch(e){}

  catch(e){ el.innerHTML = `<div class="msg">The slide images aren’t available in this copy.<br><small>They load from the decks folder published with the app (Claude copy or GitHub Pages).</small><br><br><button class="btn" data-pact="exit">Close</button></div>`; return; }

  else pres.list = all;
  pres.pos = 0;
  if (startIdx !== "" && startIdx != null && deck.startsWith("oral")) { const j = pres.list.findIndex(i => pres.data.slides[i].qi === +startIdx); if (j >= 0) pres.pos = j; }

}
function drawPresent(){
  const el = $("pres"); if (!pres.on || !pres.data) return;
  const sl = pres.data.slides[pres.list[pres.pos]], hasA = !!sl.a;
  const src = pres.data.img[pres.reveal && hasA ? sl.a : sl.q];
  el.innerHTML = `<img src="${src}" alt=""><div class="tapL" data-pact="prev"></div><div class="tapR" data-pact="next"></div>
   <div class="pbar" id="pbar"><button data-pact="prev" ${pres.pos===0?"disabled":""} aria-label="Previous">‹</button><span class="ct">${pres.pos+1} / ${pres.list.length}</span>
   ${hasA ? `<button class="${pres.reveal?"":"rev"}" data-pact="reveal">${pres.reveal ? "Hide answer" : (pres.deck==="walk" ? "Reveal finding" : "Reveal answer")}</button>` : ""}
   <button data-pact="next" ${pres.pos===pres.list.length-1?"disabled":""} aria-label="Next">›</button><button data-pact="exit">Exit</button></div>`;
  const nx = pres.data.slides[pres.list[pres.pos+1]]; if (nx) { const i = new Image(); i.src = pres.data.img[nx.q]; }
}
function pokeBar(){ const b = $("pbar"); if (!b) return; b.classList.remove("hide"); clearTimeout(pres.hideT); pres.hideT = setTimeout(() => { const x = $("pbar"); if (x) x.classList.add("hide"); }, 3500); }
function presAct(a){
  if (a === "exit") { pres.on = false; const el = $("pres"); el.hidden = true; el.innerHTML = ""; try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){} try { pres.lock && pres.lock.release(); } catch(e){} pres.lock = null; return; }
  if (!pres.data) return;
  if (a === "next" && pres.pos < pres.list.length-1) { pres.pos++; pres.reveal = false; }
  else if (a === "prev" && pres.pos > 0) { pres.pos--; pres.reveal = false; }
  else if (a === "reveal") pres.reveal = !pres.reveal;
  drawPresent(); pokeBar();
}
$("pres").addEventListener("click", ev => { const t = ev.target.closest("[data-pact]"); if (t && !t.disabled) { ev.stopPropagation(); presAct(t.dataset.pact); } else pokeBar(); });

    case "sample": { const d = sampleSessions(); demo = d.s; ui.cur = "DEMO"; ui.view = "run"; ui.ev = "P17"; ui.p = 0; window.scrollTo({top:0}); break; }
    case "open": ui.cur = v; ui.view = sessions[v].status === "submitted" ? "debrief" : "run"; ui.ev = null; ui.p = 0; ui.sel = null; window.scrollTo({top:0}); break;
    case "del": if (ui.del === v) { deleteSession(v); ui.del = null; if (ui.cur === v) ui.cur = null; toast("Session deleted"); } else { ui.del = v; setTimeout(() => { if (ui.del === v) { ui.del = null; rerender(); } }, 3500); } break;
    case "import": ui.linkFor = p; $("importFile").click(); return;
    case "flag": s.setup[v][p] = !s.setup[v][p]; touch(s); break;
    case "tr": s.setup.typeRating = !s.setup.typeRating; touch(s); break;
    case "role": s.setup.conductor.role = v; touch(s); break;
    case "link": { const w = sessions[v]; if (w) { s.setup.link[p] = snapPCWU(w, +b.dataset.i); touch(s); toast(`Linked PCWU ${w.setup.date}`); } break; }
    case "relink": { const L = s.setup.link[p], w = L && sessions[L.sid]; if (w) { s.setup.link[p] = snapPCWU(w, L.idx); touch(s); toast("PCWU refreshed"); } break; }
    case "unlink": s.setup.link[p] = null; touch(s); break;
    case "bchk": s.brief.checked[v] = s.brief.checked[v] ? 0 : 1; touch(s); break;
    case "btimer": toggleTimer(s.brief); touch(s); break;
    case "rtimer": toggleTimer(s.run); touch(s); break;
    case "doc": s.docs[p] = s.docs[p] || {}; s.docs[p][v] = s.docs[p][v] ? 0 : 1; touch(s); break;
    case "bank": s.brief.bank = +v; ui.oralTopic = ""; touch(s); break;
    case "oral": { const o = s.brief.oral[p] = s.brief.oral[p] || {}; const k = b.dataset.k; o[k] = o[k] === v ? "" : v; touch(s); break; }
    case "walk": { const o = s.brief.walk[p] = s.brief.walk[p] || {}; const k = b.dataset.k; o[k] = o[k] === v ? "" : v; touch(s); break; }
    case "ev": ui.ev = v; if (matchMedia("(max-width: 860px)").matches) { render(); const c = document.querySelector(".evcard"); if (c) c.scrollIntoView({block:"start"}); return; } break;
    case "step": { const E = EVENTS(s); const i = E.findIndex(e => e.id === ui.ev) + +v; if (E[i]) ui.ev = E[i].id; render(); const c = document.querySelector(".evcard"); if (c) c.scrollIntoView({block:"start", behavior:"smooth"}); return; }
    case "tst": { const er = s.run.ev[ui.ev] = s.run.ev[ui.ev] || {}; er.p = er.p || [{},{}]; er.p[p] = er.p[p] || {}; er.p[p].st = er.p[p].st === v ? "" : v; touch(s); break; }
    case "treps": { const er = s.run.ev[ui.ev] = s.run.ev[ui.ev] || {}; er.p = er.p || [{},{}]; er.p[p] = er.p[p] || {}; er.p[p].reps = Math.max(0,(er.p[p].reps||0) + +v); touch(s); break; }
    case "g": { const g = gRec(s,p,n); const cur0 = s.kind === "PC" ? (g.st || "") : g.st;
      if (cur0 === v) g.st = ""; else g.st = v;
      if (s.kind === "PC" && g.st === "U" && !g.rep) s.log[p].push({t:simNow(s), m:`Item ${n} ${IT(n).t} — unsatisfactory recorded`});
      touch(s); break; }
    case "rep": { const g = gRec(s,p,n); if (g.rep === v) g.rep = ""; else { g.rep = v; s.log[p].push({t:simNow(s), m:`Item ${n} ${IT(n).t} — first attempt unsat (${v}); recorded before training`}); } touch(s); break; }
    case "sub": { const g = gRec(s,p,n); g.subs = g.subs || {}; g.subs[v] = g.subs[v] ? 0 : 1;
      if (n === 10 || n === 12 || n === 14 || n === 15) {} if ((n===16||n===17) && v !== "man" && g.subs[v]) ["VOR","NDB","LOC","ASR","RNAV"].forEach(k => { if (k !== v) g.subs[k] = 0; });
      touch(s); break; }
    case "log": s.log[p].push({t:simNow(s), m:v}); touch(s); break;
    case "pilot": ui.p = +v; ui.sel = null; break;
    case "sel": ui.sel = v ? +v : null; break;
    case "goto": ui.p = p; ui.sel = +v; ui.view = "sheet"; render(); window.scrollTo({top:0}); return;
    case "result": s.debrief.p[p].result = s.debrief.p[p].result === v ? "" : v; touch(s); break;
    case "submit": if (s.demo) { toast("Sample sessions aren't submitted."); return; }
      s.status = "submitted"; if (!s.debrief.signedBy) s.debrief.signedBy = s.setup.conductor.name; if (!s.debrief.signedAt) s.debrief.signedAt = s.setup.date;
      if (s.run.startedAt) toggleTimer(s.run); touch(s); toast(store.db ? `${s.kind} submitted to the data store` : `${s.kind} submitted — saved on this device`); break;
    case "reopen": s.status = "open"; touch(s); break;
    case "exp": doExport(v); return;
    case "present": openPresent(v, b.dataset.i, (b.dataset.list||"").split(",").filter(x=>x!=="").map(Number)); return;
    default: return;
  }
  rerender();
});
render();
connectStore();
</script>
</body></html>
