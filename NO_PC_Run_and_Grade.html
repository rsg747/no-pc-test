const ORAL = [{"bank":1,"title":"PC Oral Question Bank 1","qs":[{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"What is the wingspan of the 400F / -8?","a":"213 feet (64.9 meters)\n224.5 feet (68.4 meters)","ref":"FCOM, VOL 2; 1.10.2/747-8 1.10.1"},{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"With body gear steering, what is the minimum width of pavement for a 180 degree turn of the 400F / -8?","a":"4 153 feet (46.6 meters)\n8 172 feet (52.4 meters)","ref":"FCOM, VOL 2; 1.10.3/747-8 1.10.2"},{"sec":"AC Gen, Limitations, & Performance","topic":"IMMEDIATE ACTION ITEMS","q":"Give examples of Immediate Action Items on the Quick Reference Checklist.","a":"CABIN ALTITUDE-Rapid Depressurization\n\nENG 1,2,3,4 AUTOSTART-Aborted Engine start\n\nEngine Limit or Surge or Stall\n\nIAS DISAGREE-Airspeed Unreliable\n\nFIRE ENG 1,2,3,4-Engine Severe Damage or Separation\n\nMultiple Engine Flameout or Stall","ref":"Back of Normal Checklist"},{"sec":"Engines","topic":"EEC","q":"In the normal mode, what does the EEC use as the controlling parameter for the GE engines? For PW engines?","a":"N1\nEPR","ref":"FCOM, VOL 2; 7.20.4 / 7.21.4"},{"sec":"Engines","topic":"EEC","q":"What EEC normal mode protection feature is not available in EEC Alternate mode?","a":"Thrust limiting at maximum N1 (maximum thrust can be achieved prior to thrust lever position at full forward)","ref":"FCOM, VOL 2; 7.20.4"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"How is the engine thrust reverser actuated on the GE Engine?","a":"Pneumatically actuated fan air.","ref":"FCOM, VOL 2; 7.20.15"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"How many igniters are selected for ground start, and how many for in-flight start?","a":"One igniter for ground start\n  Two for in-flight start","ref":"FCOM, VOL 2; 7.20.6"},{"sec":"APU","topic":"APU","q":"Can the APU be operated in flight?","a":"Yes \n When left running for takeoff it can be operated in\n      flight up to 20,000 feet","ref":"FCOM, VOL 2; 7.30.1"},{"sec":"APU","topic":"APU","q":"How long should you wait before turning the battery switch OFF after the APU selector is rotated to OFF, and why?","a":"2 minutes\n Allows a complete shutdown sequence, with fire detection capability.","ref":"FCOM, VOL 2; 7.30.2"},{"sec":"Electrical","topic":"ELECTRICAL SYSTEM","q":"What does the “AVAIL” light indicate on the External and APU PWR switches?","a":"The related power source (APU or EXT) is plugged in and available and the power quality is acceptable.","ref":"FCOM, VOL 2; 6.10.4/.5"},{"sec":"Electrical","topic":"ELECTRICAL SYSTEM","q":"How do you reconnect an IDG that has been disconnected?","a":"Maintenance action is required\n  The IDG cannot be restored by flight crew action","ref":"FCOM, VOL 2; 6.10.6"},{"sec":"Electrical","topic":"ELECTRICAL SYSTEM","q":"When is the main cargo deck handling bus powered?","a":"When the “AVAIL” light is displayed on the APU 2 or EXT 2 switches.","ref":"FCOM, VOL 2; 6.10.4"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does the hydraulic system (SYS FAULT) fault light indicate?","a":"Low hydraulic system pressure\n Low hydraulic reservoir quantity\n Excessive hydraulic fluid temperature\n(2 Lows & a High)","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does a hydraulic demand pump low PRESS light indicate?","a":"Demand pump selector positioned to OFF or AUX\n Demand pump operates and output pressure is low","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What degraded or inoperative systems can you expect from a loss of hydraulic system 1?","a":"(Answer is a diagram in the question bank — see reference.)","ref":"QRH 13.15 & FCOM VOL 2 13.20.3"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"How many ENGINE fire extinguishers are  provided?","a":"2 on each wing (4 TOTAL)","ref":"FCOM, VOL 2; 8.20.4"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"How many APU fire bottles are provided?","a":"1","ref":"FCOM, VOL 2; 8.20.4"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"FIRE CARGO FWD: Pressing the FWD cargo fire ARM switch causes what actions?","a":"Additional information\nTwo packs are automatically shut down \narms lower cargo compartment fire extinguishers\nconfigures equipment cooling to override mode and turns off all airflow and heat into lower cargo  compartments\ncloses master trim air valve","ref":"FCOM, VOL 2; 8.10.6 & QRH 8.16"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"Which cross feed valves are controlled by Fuel System Management logic when setting T/O flaps?","a":"Crossfeed valves 2 and 3","ref":"FCOM, VOL 2; 12.20.13"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"During the Before Start Procedure, at what center wing tank quantity are you required to select the center wing pumps on? Quantity in lbs for the LCF?","a":"7,700 kgs or more in center wing tank\n17,000 lbs or more in center wing tank","ref":"FCOM, VOL 2; 12.20.13, LCF 12.20.8"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"What is the impact on the aircraft with excessive fuel imbalance?","a":"Adversely affects CG\n  Aerodynamic drag\n  Fuel economy","ref":"FCOM, VOL 2; 12.20.3"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"In which tank is fuel temperature measured?","a":"Main tank 1","ref":"FCOM, VOL 2; 12.20.1"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"Does the Nacelle Anti-­Ice AUTO position function on the ground?","a":"No, the AUTO function only works in flight","ref":"FCOM, VOL 2; 3.10.2"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"Window heat ON switches provide both anti-icing and anti-fogging protections to which flight-deck windows?","a":"Forward left and right windshields only","ref":"FCOM, VOL 2; 3.10.4"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"How many pitot‐static probes are provided, and when are they heated?","a":"4 pitot‐static probes \nElectrically heated when any engine is operating.","ref":"FCOM, VOL 2, 3.20.3"},{"sec":"Air Systems","topic":"EQUIPMENT COOLING","q":"On the ground, when is warm equipment cooling air ducted overboard?","a":"Engines not operating\nEquipment cooling selector in NORM \nAmbient temperature moderate or high","ref":"FCOM, VOL 2; 2.20.14"},{"sec":"Air Systems","topic":"PRESSURIZATION SYSTEM","q":"When in the descent mode, will the cabin altitude controllers program a positive or a negative pressurization at touchdown?","a":"Small positive pressurization at touchdown.","ref":"FCOM, VOL 2; 2.30.2"},{"sec":"Air Systems","topic":"ENGINE BLEED AIR SYSTEM","q":"Under what conditions would High Pressure (HP) air be used?","a":"Descent\nOther low power setting operations","ref":"FCOM, VOL 2. 2.40.1"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How do you re-engage the autothrottles when the pitch mode is ALT, V/S or G/S?","a":"Push the speed switch","ref":"FCOM, VOL 2; 4.10.3"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How do you re‐engage the autothrottle when the pitch mode is VNAV ___ or FLCH SPD?","a":"Cycle the A/T ARM switch to OFF and back to ARM","ref":"FCOM, VOL 2; 4.10.3"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How can you de‐select the approach mode AFTER localizer and glide‐slope captured?","a":"Select TO/GA or Disengage autopilot and position both F/D switches off.","ref":"FCOM, VOL 2; 4.10.16"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"When will VNAV activate during takeoff?","a":"VNAV activates at 400 feet above runway elevation","ref":"FCOM, VOL 2; 4.10.8"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"On the 747-8, What does the FAC (armed) as a Roll Mode FMA indicate?","a":"APP switch selected and AFDS is set for conduct of an IAN (Integrated Approach Navigation) procedure","ref":"FCOM, VOL 2 747-8; 4.10.18"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"What source selector switch would you likely move in the event of an ALT or SPD flag in view on the PFD?","a":"Air Data Source Selector","ref":"FCOM, VOL 2; 10.10.33/58"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"On the 747-8, when do IAN Scales display?","a":"LNAV/VNAV are not active modes\nApproach is in the active flight plan\n<150 NM from destination or\n<50 NM from T/D\n<FMC is in the descent mode","ref":"FCOM, VOL 2 747-8; 10.10.13"},{"sec":"Navigation","topic":"INERTIAL REFERENCE SYSTEM","q":"When is full alignment of the IRS required?","a":"When the time from the last full alignment to the next expected arrival time exceeds 18 hours.","ref":"FCOM, VOL 2; 11.20.3"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What CDU pages are available during Alternate Navigation?","a":"Alternate navigation LEGS\nAlternate navigation PROGRESS\nAlternate navigation RADIO","ref":"FCOM, VOL 2; 11.50.2"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What VNAV Pitch mode would you expect at arrow #3 and arrow #4 with a “climb via” clearance?","a":"#3 VNAV SPD\n#4 VNAV PTH","ref":"FCOM, VOL 2; 11.31.22"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"When does the CDU message INSUFFICIENT FUEL display?","a":"Estimated fuel at destination is less than fuel reserve (FMC RSV) entered on the PERF INIT page.","ref":"FCOM, VOL 2 747-8; 11.32.5"},{"sec":"Flight Controls","topic":"FLAPS","q":"How many groups of leading flaps are provided, and how are they normally powered?","a":"Three groups on each wing: outboard, midspan, and inboard sections.\n  Normally pneumatically powered from the bleed air duct.","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"What are the two groups of trailing edge flaps, and how are they powered?","a":"Inboard and outboard\n  Inboard powered by hydraulic system 1\n  Outboard by system 4","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"What protection features do FCUs provide  for trailing edge flaps in primary mode?","a":"Asymmetry protection\nFlap load relief\nFlap position information to EICAS and other systems","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What does the BRAKE SOURCE amber light indicate when illuminated?","a":"Active brake hydraulic sources (hydraulic systems 4, 1, and 2) have low pressure","ref":"FCOM, VOL 2; 14.10.5"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What conditions must be satisfied in order for the landing gear lever lock to release?","a":"Main gear are tilted\n  Body gear centered","ref":"FCOM, VOL 2; 14.20.2"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What value on the brake \ntemperature monitoring system \ncauses the BRAKE TEMP Advisory \nEICAS message to appear?","a":"5","ref":"FCOM, VOL 2; 14.30.2"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"Can warning messages be canceled by pushing the CANC switch?","a":"No","ref":"FCOM, VOL 2; 15.10.1"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"List some of the configuration conditions that will cause the CONFIG message to display during takeoff?","a":"Flaps not in a takeoff position\nBody gear not centered\nParking brake set\nSpeedbrake lever not in DN detent\nStabilizer trim not in takeoff range","ref":"FCOM, VOL 2; 15.20.11"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"What RED alert displays are shown or displayed on the PFD?","a":"WINDSHEAR\nPULL UP\nPULL  UP","ref":"FCOM, VOL 2; 15.10.5"},{"sec":"Warning Systems","topic":"FOM","q":"Safety is best defined as __?","a":"Managed Risk\nThis acknowledges that “zero risk” is an impossibility but striving for it is not","ref":"FOM, 1.1.1"},{"sec":"Warning Systems","topic":"FOM","q":"When faced with competing objectives, what must always remain the highest priority?","a":"SAFETY","ref":"FOM, 1.1.2"}]},{"bank":2,"title":"PC Oral Question Bank 2","qs":[{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"What is the wingspan of the 400F / -8?","a":"213 feet (64.9 meters)\n224.5 feet (68.4 meters)","ref":"FCOM, VOL 2; 1.10.2/747-8 1.10.1"},{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"With body gear steering, what is the minimum width of pavement for a 180 degree turn of the 400F / -8?","a":"4 153 feet (46.6 meters)\n8 172 feet (52.4 meters)","ref":"FCOM, VOL 2; 1.10.3/747-8 1.10.2"},{"sec":"AC Gen, Limitations, & Performance","topic":"LIMITATIONS","q":"What VNAV limitation applies to level­‐off within 2,000 feet after changing the altimeter setting from QNE to QNH, or QNH to QNE?","a":"Do not use VNAV for level‐off if the QNH is \tless than 29.70in/1006 hPa.","ref":"FCOM, VOL 1; L.10.17"},{"sec":"AC Gen, Limitations, & Performance","topic":"NORMAL PROCEDURES","q":"On the 400F, 400C and -8, the Final Upper Deck/Cockpit Procedure requires the FO to do what with the Smoke Barrier Door?","a":"Ensure the door is closed and all three security locks are moved to the locked position.","ref":"FCOM, VOL 1; NP.15.34"},{"sec":"Engines","topic":"EEC","q":"What occurs with the auto-throttle system when any EEC control is switched to alternate mode?","a":"The auto-throttles disconnect, but can be reconnected when all EECs have been switched to alternate mode.","ref":"FCOM, VOL 2; 7.20.5"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"When does GENX2B67 engine selects minimum or approach idle?","a":"Engine Anti-Ice ON\n Landing Gear Down\n Flaps 20 selected\n Flap in landing position\n Thrust Reverser operation","ref":"FCOM, VOL 2 747-8; 7.20.5"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"GEnx engine inflight start attempt will increase EGT limit by 25°C after 4 start attempts and will repeat this action on subsequent reattempts until?","a":"Start is achieved or EGT limit is reached","ref":"FCOM, VOL 2 747-8; 7.20.9"},{"sec":"APU","topic":"APU","q":"How long should you wait before turning the battery switch OFF after the APU selector is rotated to OFF, and why?","a":"2 minutes\n Allows a complete shutdown sequence, with fire detection capability.","ref":"FCOM, VOL 2; 7.30.2"},{"sec":"APU","topic":"ELECTRICAL SYSTEM","q":"What does a Bus Isolation (ISLN) light illuminated indicate?","a":"BTB open\n AC bus isolated from synchronous bus","ref":"FCOM, VOL 2; 6.10.6 & QRH 6.5"},{"sec":"Electrical","topic":"ELECTRICAL SYSTEM","q":"What does the “AVAIL” light indicate on the External and APU PWR switches?","a":"The related power source (APU or EXT) is plugged in and available and the power quality is acceptable.","ref":"FCOM, VOL 2; 6.10.4/.5"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does the hydraulic system (SYS FAULT) fault light indicate?","a":"Low hydraulic system pressure\n Low hydraulic reservoir quantity\n Excessive hydraulic fluid temperature\n(2 Lows & a High)","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does a hydraulic demand pump low PRESS light indicate?","a":"Demand pump selector positioned to OFF or AUX\n Demand pump operates and output pressure is low","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"How many ENGINE fire extinguishers are  provided?","a":"2 on each wing (4 TOTAL)","ref":"FCOM, VOL 2; 8.20.4"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"Can you shut down the APU from outside the airplane?","a":"Yes\n\n\nAdditional information\nLocated in the right body gear well is the APU Ground Control Fire Protection Panel. This panel has an APU stop switch, and APU Extinguisher Discharge Switch.","ref":"FCOM, VOL 2; 8.10.9"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"Is there smoke detection provided for the Crew Rest areas?","a":"Yes\n\nSmoke detectors are installed in the crew rest areas. An aural warning sounds in the crew rest compartment when smoke is detected in that compartment.","ref":"FCOM, VOL 2; 8.20.3"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"Which cross feed valves are controlled by Fuel System Management logic when setting T/O flaps?","a":"Crossfeed valves 2 and 3","ref":"FCOM, VOL 2; 12.20.13"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"What is the impact on the aircraft with excessive fuel imbalance?","a":"Adversely affects CG\n  Aerodynamic drag\n  Fuel economy","ref":"FCOM, VOL 2; 12.20.3"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"Which fuel tanks do reserve tank 1 and 4 transfer to on the 747-8?","a":"Main tanks 1 and 4","ref":"FCOM, VOL 2 747-8; 12.20.8"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"Does the Nacelle Anti-­Ice AUTO position function on the ground?","a":"No, the AUTO function only works in flight","ref":"FCOM, VOL 2; 3.10.2"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"Is wing anti­ice effective with the leading edge flaps extended?","a":"No, wing anti‐ice is ineffective when the LEF are not \n retracted.","ref":"FCOM, VOL 2; 3.10.2"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"The 747-8 EICAS msg BLD LOW TEMP indicates __?","a":"Engine bleed air to low for sufficient wing anti-icing","ref":"FCOM, VOL 2 747-8; 3.20.2"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"What is the function of the LOWER LOBE  CARGO CONDITIONED AIR FLOW RATE Selector?","a":"Provides forward and aft cargo lobe conditioned air","ref":"FCOM, VOL 2; 2.20.7"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"On the 747-8 with Main Deck and FWD/AFT lower lobe temperature selector in the OFF position, what is the temperature zone target?","a":"68◦F/ 20◦C","ref":"FCOM, VOL 2 747-8; 2.10.11"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"The 747-8 Lower Lobe Aft Cargo Heat Selector regulates temperature control valve to maintain at least __ ◦F/ __ ◦C in LOW position and __ ◦F/ __ ◦C in HIGH position ?","a":"40◦F/ 4◦C\n  50◦F/ 10◦C","ref":"FCOM, VOL 2 747-8; 2.10.3"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"What does the Zone System (SYS) Fault  Light indicate?","a":"Temperature zone duct overheat or zone temperature controller fault has occurred.\n Master trim air valve failed closed\nMaster trim air valve closed and pack air continues to flow","ref":"FCOM, VOL 2; 2.10.5"},{"sec":"Air Systems","topic":"ENGINE BLEED AIR SYSTEM","q":"When bleed air pressure is available the Engine Bleed Air Switches control which valves by system logic,?","a":"PRV\n HP Bleed Valve\n Engine Bleed Air Valve","ref":"FCOM, VOL 2; 2.10.26"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How do you re-engage the autothrottles when the pitch mode is ALT, V/S or G/S?","a":"Push the speed switch","ref":"FCOM, VOL 2; 4.10.3"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How do you re‐engage the autothrottles when the pitch mode is\nVNAV ___ or FLCH SPD?","a":"Cycle the A/T ARM switch to OFF and back to ARM","ref":"FCOM, VOL 2; 4.10.3"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How can you de‐select the approach mode AFTER localizer and glide‐slope captured?","a":"Select TO/GA or Disengage autopilot and position both F/D switches off.","ref":"FCOM, VOL 2; 4.10.16"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"Can the glideslope be captured prior to  Localizer intercept?","a":"No, glideslope capture is inhibited until localizer capture and the intercept angle is within 80 degrees of the localizer course.","ref":"FCOM, VOL 2; 4.10.16; 4.20.11"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"Describe the condition that would cause VNAV ALT to display as the pitch mode.","a":"A conflict occurs between the VNAV profile and \n\tMCP altitude.","ref":"FCOM, VOL 2; 4.20.7"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"On the 744,LCF, -8, NO AUTOLAND displays on PFD if a multichannel approach (MCA) is selected but MCA engage status (LAND 2/3) has not been annunciated by __ feet?","a":"600 feet AGL","ref":"FCOM, VOL 2 4.10.17, LCF; 4.10.15, 747-8; 4.10.16"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"What indicates you are 1/3 of a dot deviation from the Localizer?","a":"The Localizer pointer is just touching the rectangle during  \n      expanded localizer deviation scale.\nAt low radio altitudes, with autopilot or FD engaged, scale turns amber and flashes to indicate excessive LOC deviation","ref":"FCOM, VOL 1; SP.4.7/VOL 2; 10.10.19"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"On the 747-8, how is the airspeed range for acceptable VNAV path indicated on the PFD airspeed display (flaps up or down)?","a":"UP\n240\n260\n220\n200\n180\nVNAV Speed Band","ref":"FCOM, VOL 2 747-8; 10.10.5"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"On the 747-8, what does the Vertical Situation Display (VSD) represent?","a":"A profile view of the airplane and its environment along the current track","ref":"FCOM, VOL 2 747-8; 10.40.2"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What CDU pages are available during Alternate Navigation?","a":"Alternate navigation LEGS\nAlternate navigation PROGRESS\nAlternate navigation RADIO","ref":"FCOM, VOL 2; 11.50.2"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What could happen if you advance the thrust levers  further then TO 1 or TO 2 fixed derate following an engine failure?","a":"Loss of directional control","ref":"FCOM, VOL 2; 11.32.3"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What factor determines “Econ” speed?","a":"Cost index","ref":"FCOM, VOL 2; 11.31.4"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"When armed for takeoff, when does VNAV activate?","a":"400 feet","ref":"FCOM, VOL 2; 11.31.22"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What VNAV FMA would display on the PFD during departure waypoint altitude constraints?","a":"VNAV PTH","ref":"FCOM, VOL 2; 11.31.23"},{"sec":"Flight Controls","topic":"FLAPS","q":"How many groups of leading flaps are provided, and how are they normally powered?","a":"Three groups on each wing: outboard, midspan, and inboard sections.\n  Normally pneumatically powered from the bleed air duct.","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"What are the two groups of trailing edge flaps, and how are they powered?","a":"Inboard and outboard\n  Inboard powered by hydraulic system 1\n  Outboard by system 4","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"What protection features do FCUs provide  for trailing edge flaps in primary mode?","a":"Asymmetry protection\nFlap load relief\nFlap position information to EICAS and other systems","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"Is there any asymmetry protection in  alternate flap mode?","a":"NO, there is no protection provided by the FCUs in alternate mode.","ref":"FCOM, VOL 2; 9.20.14"},{"sec":"Flight Controls","topic":"FLAPS","q":"How does the Flap Alternate Control mode work?","a":"Bypasses the FCUs \n  Can be manually selected\n  All flaps are extended or retracted by \telectric motors","ref":"FCOM, VOL 2; 9.20.14"},{"sec":"Flight Controls","topic":"FLIGHT CONTROLS","q":"747-8, To improve takeoff performance and reduce noise, outboard ailerons deflected down* at which flap settings? They return to the neutral position at which flap settings? Inboard ailerons droop in which flap settings?","a":"10 or 20\n  25 or 30\n  10 or greater\n*The downward deflection is removed if the\nangle of attack is above the stick shaker","ref":"FCOM, VOL 2; 9.20.11"},{"sec":"Flight Controls","topic":"FLIGHT CONTROLS","q":"What system assists the 747-8 in pitch stability and landing flare?","a":"Pitch augmentation control system (PACS)\n\nAdditional Information\nDuring the landing flare, this system provides a small amount of nose up elevator as the airplane approaches the runway, without moving the control column","ref":"FCOM, VOL 2 747-8; 9.20.3"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What does the BRAKE SOURCE amber light indicate when illuminated?","a":"Active brake hydraulic sources (hydraulic systems 4, 1, and 2) have low pressure","ref":"FCOM, VOL 2; 14.10.5"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What value on the brake \ntemperature monitoring system \ncauses the BRAKE TEMP Advisory \nEICAS message to appear?","a":"5","ref":"FCOM, VOL 2; 14.30.2"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What does an EICAS message LIMITER indicate?","a":"Brake torque limiter failure on more than one wheel per truck\nThe parking brake lever is released and the parking brake valve is not fully open\nBrake system control unit power loss occurs","ref":"FCOM, VOL 2, 14.30.1, 747-8; 14.20.4"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"What are the 4 types of EICAS messages?","a":"Warning Messages\nCaution Messages\nAdvisory Messages\nMemo Messages","ref":"FCOM, VOL 2; 15.20.2"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"List some of the configuration conditions that will cause the CONFIG message to display during takeoff?","a":"Flaps not in a takeoff position\nBody gear not centered\nParking brake set\nSpeedbrake lever not in DN detent\nStabilizer trim not in takeoff range","ref":"FCOM, VOL 2; 15.20.11"},{"sec":"Warning Systems","topic":"FOM","q":"When faced with competing objectives, what must always remain the highest priority?","a":"SAFETY","ref":"FOM, 1.1.2"}]},{"bank":3,"title":"PC Oral Question Bank 3","qs":[{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"What is the wingspan of the 400F / -8?","a":"213 feet (64.9 meters)\n224.5 feet (68.4 meters)","ref":"FCOM, VOL 2; 1.10.2/747-8 1.10.1"},{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"With body gear steering, what is the minimum width of pavement for a 180 degree turn of the 400F / -8?","a":"4 153 feet (46.6 meters)\n8 172 feet (52.4 meters)","ref":"FCOM, VOL 2; 1.10.3/747-8 1.10.2"},{"sec":"AC Gen, Limitations, & Performance","topic":"LIMITATIONS","q":"What are maximum and minimum glideslope angles for ILS autoland?","a":"3.25 degrees (max); 2.5 degrees (min)","ref":"FCOM, VOl 1; L.10.7"},{"sec":"AC Gen, Limitations, & Performance","topic":"LIMITATIONS","q":"Are operations allowed when the reported braking action is NIL?","a":"No","ref":"FCOM, VOl 1; L.10.3"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"What happens when you turn the Continuous (CON)  IGNITION Switch ON?","a":"Selected igniters operate continuously\n  Commands approach idle minimum","ref":"FCOM, VOL 2; 7.13.4"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"With an engine shut down, what does “X‐BLD” indicate when displayed next to the N2 indication?","a":"Crossbleed air is recommended for in-flight start.","ref":"FCOM, VOL 2; 7.11.6"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"What color does the EGT change to if the EGT start or takeoff limit is reached?","a":"Red","ref":"FCOM, VOL 2; 7.10.8"},{"sec":"APU","topic":"APU","q":"Can the APU be operated in flight?","a":"Yes \n When left running for takeoff it can be operated in\n      flight up to 20,000 feet","ref":"FCOM, VOL 2; 7.30.1"},{"sec":"APU","topic":"ELECTRICAL SYSTEM","q":"What are some of the equipment items powered by the Utility busses?","a":"5 fuel pumps\nGalley equipment","ref":"FCOM, VOL 2; 6.20.7"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does the hydraulic system (SYS FAULT) fault light indicate?","a":"Low hydraulic system pressure\n Low hydraulic reservoir quantity\n Excessive hydraulic fluid temperature\n(2 Lows & a High)","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does a hydraulic demand pump low PRESS light indicate?","a":"Demand pump selector positioned to OFF or AUX\n Demand pump operates and output pressure is low","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What degraded or inoperative systems can you expect from a loss of hydraulic system 4?","a":"(Answer is a diagram in the question bank — see reference.)","ref":"QRH 13.17 & FCOM VOL 2 13.20.3"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"How many APU fire bottles are provided?","a":"1","ref":"FCOM, VOL 2; 8.20.4"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"What action discharges the APU fire  extinguisher?","a":"Rotate - discharges APU fire extinguisher into APU compartment.\n\nAdditional information\nOn the ground, the APU extinguisher automatically discharges on N408MC - N418MC, N-PA, N475MC – N477MC, N489MC, N492-N499MC, N850GT-N859GT","ref":"FCOM, VOL 2 400/-8; 8.10.3 & QRH 8.1"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"Is the engine fire/overheat detection system a single loop or dual loop system?","a":"Dual loop  \n\nAdditional information\nA dual loop fire detector is installed in each engine nacelle. In addition, each engine has a dual loop overheat detector. In normal operation, both loops in a detector must detect a fire or overheat condition to cause an engine fire warning or overheat caution unless configured for single loop operation.","ref":"FCOM, VOL 2; 8.20.2"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"Which cross feed valves are controlled by Fuel System Management logic when setting T/O flaps?","a":"Crossfeed valves 2 and 3","ref":"FCOM, VOL 2; 12.20.13"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"What is the impact on the aircraft with excessive fuel imbalance?","a":"Adversely affects CG\n  Aerodynamic drag\n  Fuel economy","ref":"FCOM, VOL 2; 12.20.3"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"During fuel jettison on the LCF, transfer valves open when fuel quantity in tanks 2 or 3 decrease to __ pounds?","a":"20,000 pounds","ref":"FCOM, VOL 2 747-LCF; 12.20.7"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"When do the FSMCs open the reserve transfer valves on the 400, LCF, -8?","a":"400: When main tank 2 or 3 fuel quantity decreases  \n   \t to approximately 18,200 kgs.\n       (Fuel transfers from reserve tanks 2 and 3 to the related main tank.)\nLCF: When main tank 2 or 3 fuel quantity decreases  \n   \t to approximately 40,200 lbs.\n       (Fuel transfers from reserve tanks 2 and 3 to the related main tank.)\n-8: When main tank 1 or 4 fuel quantity decreases  \n   \t to approximately 6100 kgs\n        (Fuel transfers from reserve tanks 1 and 4 to the related main tank.)","ref":"FCOM, VOL 2; 12.20.12, LCF 12.20.7, -8 12.20.8"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"Is wing anti­ice effective with the leading edge flaps extended?","a":"No, wing anti‐ice is ineffective when the LEF are not \n retracted.","ref":"FCOM, VOL 2; 3.10.2"},{"sec":"Air Systems","topic":"ANTI‐ICE/WINDOW HEAT","q":"How many ice detection probes are there, and where are they located?","a":"Two probes are located on the forward fuselage","ref":"FCOM, VOL 2; 3.20.1"},{"sec":"Air Systems","topic":"ANTI‐ICE/WINDOW HEAT","q":"On the -8, what indications are displayed, on primary EICAS, when the nacelle anti‐ice and/or the wing anti‐ice valve is open?","a":"“EAI” for engine nacelle anti‐ice\n  “WAI” for wing anti-­ice","ref":"FCOM, VOL 2; 3.10.4"},{"sec":"Air Systems","topic":"EQUIPMENT COOLING","q":"How can you manually configure the equipment cooling system for flight?","a":"Positioning the Equipment Cooling Selector to STBY.","ref":"FCOM, VOL 2; 2.20.14"},{"sec":"Air Systems","topic":"PRESSURIZATION SYSTEM","q":"How many cabin altitude controllers are provided?","a":"Two controllers A and B\nEach controller controls both outflow valves","ref":"FCOM, VOL 2; 2.30.1"},{"sec":"Air Systems","topic":"ENGINE BLEED AIR SYSTEM","q":"What does a bleed duct isolation (ISLN) VALVE light indicate?","a":"Isolation valve position disagrees with switch position","ref":"FCOM, VOL 2; 2.10.25"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How do you re-engage the autothrottles when the pitch mode is ALT, V/S or G/S?","a":"Push the speed switch","ref":"FCOM, VOL 2; 4.10.3"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How do you re‐engage the autothrottles when the pitch mode is\nVNAV ___ or FLCH SPD?","a":"Cycle the A/T ARM switch to OFF and back to ARM","ref":"FCOM, VOL 2; 4.10.3"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"What does an amber horizontal line displayed through the affected ACTIVE pitch or roll mode indicate?","a":"A flight mode fault is detected","ref":"FCOM, VOL 2; 4.10.17"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"In flight, when is TO/GA armed?","a":"Flaps out of up or Glideslope captured","ref":"FCOM, VOL 2; 4.20.5"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"On approach, with first push of TO/GA, what active Autothrottle mode would the FMA display with the A/T armed?","a":"THR","ref":"FCOM, VOL 2; 4.20.14"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"With the APP switch selected, what altitude will the electrical busses isolate allowing multiple autopilot engagement for Autoland operations?","a":"Below 1,500 feet radio altitude","ref":"FCOM, VOL 2; 4.10.16/4.20.1"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"During autoland, what action normally disconnects the autothrottles?","a":"A reverse thrust lever is raised to reverse idle","ref":"FCOM, VOL 2; 4.20.12"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"What indicates you are 1/3 of a dot deviation from the Localizer?","a":"The Localizer pointer is just touching the rectangle during  \n      expanded localizer deviation scale.\nAt low radio altitudes, with autopilot or FD engaged, scale turns amber and flashes to indicate excessive LOC deviation","ref":"FCOM, VOL 1; SP.4.7/VOL 2; 10.10.19"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"On the 747-8, what will display if the Integrated Standby Flight Display (ISFD) initialization is not complete within six minutes?","a":"ATT:RST initialization\n     message","ref":"FCOM, VOL 2 747-8; 10.10.62"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What CDU pages are available during Alternate Navigation?","a":"Alternate navigation LEGS\nAlternate navigation PROGRESS\nAlternate navigation RADIO","ref":"FCOM, VOL 2; 11.50.2"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What could happen if you advance the thrust levers  further then TO 1 or TO 2 fixed derate following an engine failure?","a":"Loss of directional control","ref":"FCOM, VOL 2; 11.32.3"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"NG FMC, “on approach” logic occurs under any of the following conditions?","a":"Descent phase flaps out of up\nFirst waypoint sequenced of active nav database\nAircraft less than 12NM from destination airport direct-to or intercept course-to active waypoint and a manually entered end of descent altitude constraint is lower than the destination airport plus 500 feet\nThe runway or missed approach point is the active waypoint and the airplane is within 25NM of the runway","ref":"FCOM, VOL 2 747-8; 11.31.35"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"On the 747-8, What modes of operation are available for the MultiScan weather radar?","a":"Manual mode – operates like traditional radar with full control over tilt and gain settings\n\nAutomatic mode – collects data from multiple scans and merges information into a total weather picture\nVOR R\nADF R\nOFF\nTERR\nPOS\nDATA\nARPT\nWPT\nSTA\nWXR\nOFF\nVOR L\nADF L\nOFF\nOFF\nAPP\nPLN\nR I G H T","ref":"FCOM, VOL 2; 11.31.3"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What is the difference between RNP and ACTUAL? And where is it displayed?","a":"RNP is required navigation performance\n  ACTUAL is Actual Aircraft Navigation Performance \n  Displayed on FMC POS REF page","ref":"FCOM, VOL 2; 11.47.30"},{"sec":"Flight Controls","topic":"FLAPS","q":"How many groups of leading flaps are provided, and how are they normally powered?","a":"Three groups on each wing: outboard, midspan, and inboard sections.\n  Normally pneumatically powered from the bleed air duct.","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"What are the two groups of trailing edge flaps, and how are they powered?","a":"Inboard and outboard\n  Inboard powered by hydraulic system 1\n  Outboard by system 4","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"What protection features do FCUs provide  for trailing edge flaps in primary mode?","a":"Asymmetry protection\nFlap load relief\nFlap position information to EICAS and other systems","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAP","q":"How long does the flap indication on  primary EICAS remain displayed after all flaps are up?","a":"10 seconds","ref":"FCOM, VOL 2; 9.20.15"},{"sec":"Flight Controls","topic":"FLAPS","q":"What is the maximum extension of the  trailing edge flaps in alternate mode?","a":"Flaps 25","ref":"FCOM, VOL 2; 9.20.15"},{"sec":"Flight Controls","topic":"FLIGHT CONTROLS","q":"What surface component is moved when  stabilizer trim inputs are made?","a":"Leading edge of the movable horizontal stabilizer\n  Stabilizer trim varies the angle of incidence of the\n   horizontal stabilizer","ref":"FCOM, VOL 2; 9.20.3"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What does the BRAKE SOURCE amber light indicate when illuminated?","a":"Active brake hydraulic sources (hydraulic systems 4, 1, and 2) have low pressure","ref":"FCOM, VOL 2; 14.10.5"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What value on the brake \ntemperature monitoring system \ncauses the BRAKE TEMP Advisory \nEICAS message to appear?","a":"5","ref":"FCOM, VOL 2; 14.30.2"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"How does the landing gear extend with the alternate gear extension system?","a":"By pushing the alternate gear extend switches the gear uplocks and door latches are electrically released and the gear free‐falls.\n\nGravity and airloads extend the gear\nSprings pull the downlocks into the locked position","ref":"FCOM VOL 2; 14.20.2"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"Can amber alert messages be canceled or recalled?","a":"Yes, by pushing the CANC switch or the RCL switch.","ref":"FCOM, VOL 2; 15.10.1"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"List some of the configuration conditions that will cause the CONFIG message to display during takeoff?","a":"Flaps not in a takeoff position\nBody gear not centered\nParking brake set\nSpeedbrake lever not in DN detent\nStabilizer trim not in takeoff range","ref":"FCOM, VOL 2; 15.20.11"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"When you receive a TCAS RA, where do you position  the center of the airplane symbol on the PFD?","a":"Outside the red outlined RA pitch regions.","ref":"FCOM, VOL 2; 15.10.13"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"What conditions will cause the CONFIG GEAR EICAS warning message?","a":"Any landing gear not down and locked\n\nWith any of the below conditions\nAny thrust lever is closed and the RA is less than 800 feet  \nFlaps in a landing position (25 or more)","ref":"FCOM, VOL 2; 15.20.10"},{"sec":"Warning Systems","topic":"FOM","q":"When faced with competing objectives, what must always remain the highest priority?","a":"SAFETY","ref":"FOM, 1.1.2"}]},{"bank":4,"title":"PC Oral Question Bank 4","qs":[{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"With body gear steering, what is the minimum width of pavement for a 180 degree turn of the 400F / -8?","a":"4 153 feet (46.6 meters)\n8 172 feet (52.4 meters)","ref":"FCOM, VOL 2; 1.10.3/747-8 1.10.2"},{"sec":"AC Gen, Limitations, & Performance","topic":"LIMITATIONS","q":"What is turbulent air penetration speed -400 and -8?","a":"290 to 310 KIAS/0.82 to 0.85 Mach, whichever is lower.\n310 KTS/0.83 Mach.","ref":"FCOM, VOL 1; L.10.2"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"On the -400, what 3 items will the autostart system protect the engine from during and engine start that also will result in an ENG 1, 2, 3, 4 AUTOSTART EICAS message ?","a":"Hot start\nHung start \nNo EGT rise","ref":"FCOM, VOL 2; 7.20.7 & QRH 7.2"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"How is the engine thrust reverser actuated on the GEnx B747-8?","a":"Hydraulically actuated fan air.","ref":"FCOM, 747-8 VOL 2; 7.20.15"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"GENX2B67 engine EEC’s command ice crystal anti icing when ice crystal icing conditions are detected at altitudes higher than __?","a":"30,000 feet","ref":"FCOM, VOL 2 747-8; 7.20.4"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"Under what condition on the ground will the GEnx EEC shutdown an engine to provide protection against thrust asymmetry due to a control malfunction?","a":"Thrust lever at/near idle and,\nEngine above command N1 speed and not decelerating normally","ref":"FCOM, VOL 2 747-8; 7.20.6"},{"sec":"APU","topic":"APU","q":"How long should you wait before turning the battery switch OFF after the APU selector is rotated to OFF, and why?","a":"2 minutes\n Allows a complete shutdown sequence, with fire detection capability.","ref":"FCOM, VOL 2; 7.30.2"},{"sec":"APU","topic":"ELECTRICAL SYSTEM","q":"What condition would automatically disconnect the IDG if not manually disconnected by the flight crew?","a":"Excessively high drive oil temperature","ref":"FCOM, VOL 2; 6.20.3"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does the hydraulic system (SYS FAULT) fault light indicate?","a":"Low hydraulic system pressure\n Low hydraulic reservoir quantity\n Excessive hydraulic fluid temperature\n(2 Lows & a High)","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does a hydraulic demand pump low PRESS light indicate?","a":"Demand pump selector positioned to OFF or AUX\n Demand pump operates and output pressure is low","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"How many APU fire bottles are provided?","a":"1","ref":"FCOM, VOL 2; 8.20.4"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"What unlocks an engine fire switch?","a":"1.  Fire warning\n2.  FUEL CONTROL switch is in CUTOFF\n3.  Pushing the fire override switch","ref":"FCOM, VOL 2; 8.10.1; 8.20.4"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"Which cross feed valves are controlled by Fuel System Management logic when setting T/O flaps?","a":"Crossfeed valves 2 and 3","ref":"FCOM, VOL 2; 12.20.13"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"What is the impact on the aircraft with excessive fuel imbalance?","a":"Adversely affects CG\n  Aerodynamic drag\n  Fuel economy","ref":"FCOM, VOL 2; 12.20.3"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"How does Center Wing Tank Fuel scavenge in the LCF?","a":"CWT electric pump into M2 tank when\nCWT override/jettison pump has low pressure\nFuel quantity in M2 or M3 tank is below 40200 lbs\n(Pump will operate for approximately two hours or until scavenge pump pressure is low, whichever occurs first)","ref":"FCOM, VOL 2; LCF 12.20.1"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"On the 747-8, at what fuel quantity will the fuel jettison complete jettison operations with the selector in MLW position?","a":"Maximum landing weight plus 3000 kgs","ref":"FCOM, VOL 2 747-8; 12.20.11"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"Describe what happens when nacelle anti‐ice is commanded on?","a":"NAI valve opens\n Selected engine igniters operate continuously\n Engine PRV opens when the NAI valve is open","ref":"FCOM, VOL 2; 3.10.2"},{"sec":"Anti-Ice/Window Heat","topic":"ANTI‐ICE/WINDOW HEAT","q":"On the -400, what indications are displayed, on primary EICAS, when the nacelle anti‐ice and/or the wing anti‐ice valve is open?","a":"“NAI” for nacelle anti‐ice\n  “WAI” for wing anti-­ice","ref":"FCOM, VOL 2; 3.10.4"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"What is the function of the LOWER LOBE  CARGO CONDITIONED AIR FLOW RATE Selector?","a":"Provides forward and aft cargo lobe conditioned air","ref":"FCOM, VOL 2; 2.20.7"},{"sec":"Air Systems","topic":"EQUIPMENT COOLING","q":"When does the equipment cooling system  configure for flight?","a":"One or more engines on each wing is operating.","ref":"FCOM, VOL 2; 2.20.14"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"On the 747-8, what does the alternate ventilation system provide with Pack 1+2+3 shutdown and the airplane depressurized?","a":"outside air to the flight deck","ref":"FCOM, VOL 2 747-8; 2.20.3"},{"sec":"Air Systems","topic":"ENGINE BLEED AIR SYSTEM","q":"How would you isolate a bleed air duct section in the event of a bleed duct leak\nis detected?","a":"Close the respective isolation valve\n  Close the engine bleed air valves.","ref":"FCOM, VOL 2; 2.40.3/QRH 400FC 2.5"},{"sec":"Air Systems","topic":"ENGINE BLEED AIR SYSTEM","q":"With a right duct isolated, how will this affect the hydraulic systems?","a":"The hydraulic demand pump 4 is turned off\nNo hydraulic system 3 and 4 reservoir pressure","ref":"QRH 2.4"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How do you re-engage the autothrottles when the pitch mode is ALT, V/S or G/S?","a":"Push the speed switch","ref":"FCOM, VOL 2; 4.10.3"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How can you de‐select the approach mode AFTER localizer and glide‐slope captured?","a":"Select TO/GA or Disengage autopilot and position both F/D switches off.","ref":"FCOM, VOL 2; 4.10.16"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"When does the ROLLOUT mode activate?","a":"Below 5 feet","ref":"FCOM, VOL 2; 4.20.12"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"What autothrottle mode is activated with the second push of the TO/GA switch?","a":"THR REF, at full go‐around thrust","ref":"FCOM, VOL 2; 4.20.14"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"What indicates you are 1/3 of a dot deviation from the Localizer?","a":"The Localizer pointer is just touching the rectangle during  \n      expanded localizer deviation scale.\nAt low radio altitudes, with autopilot or FD engaged, scale turns amber and flashes to indicate excessive LOC deviation","ref":"FCOM, VOL 1; SP.4.7/VOL 2; 10.10.19"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"If the display selector panel fails, how can you select the synoptic displays for the lower EICAS?","a":"Through the respective CDU","ref":"FCOM, VOL 2; 10.10.50"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"On the 747-8, When do the Vertical Anticipation Cues display?","a":"Within 25NM of missed approach point\nWithin 60◦ of Final Approach Course\nTrack within 90◦ of FAC\n<6000 feet above field elevation","ref":"FCOM, VOL 2 747-8; 10.10.13"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"747-8, VSD enroute swath is inhibited on takeoff and approach when the airplane is within __NM of the runway and less than __ ft AFE?","a":"6 NM\n3000 ft","ref":"FCOM, VOL 2 747-8; 10.40.20"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What could happen if you advance the thrust levers  further then TO 1 or TO 2 fixed derate following an engine failure?","a":"Loss of directional control","ref":"FCOM, VOL 2; 11.32.3"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"On a -400F Legacy FMC, when does the approach phase of the FMS start, also know as “on approach logic”?","a":"When the initial fix of an approach sequences\nWhen the runway is the active waypoint and within 25nm","ref":"FCOM, VOL 2; 11.31.2"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"When will the FMC fail to sequence the active waypoint?","a":"When more than 21 nm from the active route and not on an offset route.","ref":"FCOM, VOL 2; 11.31.3"},{"sec":"Flight Controls","topic":"FLAPS","q":"What are the two groups of trailing edge flaps, and how are they powered?","a":"Inboard and outboard\n  Inboard powered by hydraulic system 1\n  Outboard by system 4","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"What protection features do FCUs provide  for trailing edge flaps in primary mode?","a":"Asymmetry protection\nFlap load relief\nFlap position information to EICAS and other systems","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"What happens if a primary control failure occurs in either the inboard or midspan  leading edge flap group?","a":"Both groups switch to secondary mode","ref":"FCOM, VOL 2; 9.20.14"},{"sec":"Flight Controls","topic":"FLAP CONTROLS","q":"What is the affect on the flap system during  engine reverse thrust operation?","a":"Inboard and midspan leading edge flaps retract automatically","ref":"FCOM, VOL 2; 9.20.15"},{"sec":"Flight Controls","topic":"FLIGHT CONTROLS","q":"When does the 747-8 takeoff and landing tail strike protection activate?","a":"PACS senses imminent tail strike\nDecreasing elevator deflection\n\nAdditional Information\nActivation of tail strike protection does not move the control column","ref":"FCOM, VOL 2 747-8; 9.20.3"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What does the BRAKE SOURCE amber light indicate when illuminated?","a":"Active brake hydraulic sources (hydraulic systems 4, 1, and 2) have low pressure","ref":"FCOM, VOL 2; 14.10.5"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What value on the brake \ntemperature monitoring system \ncauses the BRAKE TEMP Advisory \nEICAS message to appear?","a":"5","ref":"FCOM, VOL 2; 14.30.2"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"How many degrees can the nose‐wheel steering system turn the nose gear with the tiller, and how many degrees with the rudder pedals?","a":"•   70 degrees in either direction with the tiller \n7 degrees with the rudder pedals","ref":"FCOM, VOL 2; 14.10.2, and 14.10.3"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What does a white, crosshatched,  expanded gear position indication mean?","a":"Related landing gear in transit","ref":"FCOM, VOL 2; 14.10.7"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"What are the 4 types of EICAS messages?","a":"Warning Messages\nCaution Messages\nAdvisory Messages\nMemo Messages","ref":"FCOM, VOL 2; 15.20.2"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"Can amber alert messages be canceled or recalled?","a":"Yes, by pushing the CANC switch or the RCL switch.","ref":"FCOM, VOL 2; 15.10.1"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"List some of the configuration conditions that will cause the CONFIG message to display during takeoff?","a":"Flaps not in a takeoff position\nBody gear not centered\nParking brake set\nSpeedbrake lever not in DN detent\nStabilizer trim not in takeoff range","ref":"FCOM, VOL 2; 15.20.11"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"What does the STATUS Cue mean?","a":"A new status message exists on the (Secondary EICAS) \n\nDisplayed Cyan color","ref":"FCOM, VOL 2; 15.10.2"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"On the 747-8, during takeoff and landing a BANK ANGLE alert sounds for bank angles as small as __?","a":"10°","ref":"FCOM, VOL 2 747-8; 15.20.25"},{"sec":"Warning Systems","topic":"FOM","q":"Safety is best defined as __?","a":"Managed Risk\nThis acknowledges that “zero risk” is an impossibility but striving for it is not","ref":"FOM, 1.1.1"},{"sec":"Warning Systems","topic":"FOM","q":"When faced with competing objectives, what must always remain the highest priority?","a":"SAFETY","ref":"FOM, 1.1.2"}]},{"bank":5,"title":"PC Oral Question Bank 5","qs":[{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"What is the wingspan of the 400F / -8?","a":"213 feet (64.9 meters)\n224.5 feet (68.4 meters)","ref":"FCOM, VOL 2; 1.10.2/747-8 1.10.1"},{"sec":"AC Gen, Limitations, & Performance","topic":"Airplane General","q":"With body gear steering, what is the minimum width of pavement for a 180 degree turn of the 400F / -8?","a":"4 153 feet (46.6 meters)\n8 172 feet (52.4 meters)","ref":"FCOM, VOL 2; 1.10.3/747-8 1.10.2"},{"sec":"AC Gen, Limitations, & Performance","topic":"LIMITATIONS","q":"What is the minimum in-flight fuel temperature for the -8?","a":"-48◦C","ref":"FCOM, VOL 1; L.10.20"},{"sec":"Engines","topic":"EEC","q":"In the normal mode, what does the EEC use as the controlling parameter for the GE engines? For PW engines?","a":"N1\nEPR","ref":"FCOM, VOL 2; 7.20.4 / 7.21.4"},{"sec":"Engines","topic":"EEC","q":"What protection features are provided in the EEC Normal mode?","a":"Thrust limiting\nMaintains constant thrust\nOver-speed protection","ref":"FCOM, VOL 2; 7.20.4/.5"},{"sec":"Engines","topic":"EEC","q":"When does the EEC select approach idle?","a":"Nacelle anti-ice is ON\nFlaps in a landing position\nContinuous ignition switch is ON\nDuring thrust reverser operation","ref":"FCOM, VOL 2, 7.20.5"},{"sec":"Engines","topic":"ENGINE/ENGINE START/IGNITION","q":"What are the PW engine warm up requirements for oil temperature before takeoff?","a":"above the lower amber band","ref":"FCOM, VOL 2; 7.20.8"},{"sec":"APU","topic":"APU","q":"How long should you wait before turning the battery switch OFF after the APU selector is rotated to OFF, and why?","a":"2 minutes\n Allows a complete shutdown sequence, with fire detection capability.","ref":"FCOM, VOL 2; 7.30.2"},{"sec":"APU","topic":"APU","q":"Is electrical power available from the APU in flight?","a":"No","ref":"FCOM, VOL 2; 7.30.1"},{"sec":"Electrical","topic":"ELECTRICAL SYSTEM","q":"What does the “AVAIL” light indicate on the External and APU PWR switches?","a":"The related power source (APU or EXT) is plugged in and available and the power quality is acceptable.","ref":"FCOM, VOL 2; 6.10.4/.5"},{"sec":"Electrical","topic":"ELECTRICAL SYSTEM","q":"What electrical power source provides power for the lower lobe cargo handling, fueling  panel, and AUX 4 hydraulic pump?","a":"EXT PWR 1 or APU GEN 1 is AVAIL or selected ON (powering the Ground Handling bus)","ref":"FCOM, VOL 2; 6.20.5"},{"sec":"Electrical","topic":"ELECTRICAL SYSTEM","q":"How is the electrical system configured during an automatic ILS approach (autoland)?","a":"AC and DC busses 1, 2, and 3 are isolated from the sync bus\n AC bus 4 continues to power the synchronous bus","ref":"FCOM, VOL 2; 6.20.8"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does the hydraulic system (SYS FAULT) fault light indicate?","a":"Low hydraulic system pressure\n Low hydraulic reservoir quantity\n Excessive hydraulic fluid temperature\n(2 Lows & a High)","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"What does a hydraulic demand pump low PRESS light indicate?","a":"Demand pump selector positioned to OFF or AUX\n Demand pump operates and output pressure is low","ref":"FCOM, VOL 2; 13.10.2"},{"sec":"Hydraulics","topic":"HYDRAULICS","q":"When is the engine driven hydraulic pump pressurized?","a":"The engine is running\n  The engine pump switch is ON","ref":"FCOM, VOL 2; 13.20.1"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"What does arming the FWD CARGO fire switch will do on the Passenger aircraft?","a":"Arms cargo fire extinguisher\nConfigures equipment cooling to override mode and turns off airflow and heat to forward compartment\nTurns off PACK 3\nTurns off nitrogen generation system","ref":"FCOM, VOL 2; 8.10.4"},{"sec":"Fire Protection & Detection","topic":"FIRE PROTECTION & DETECTION","q":"How many fire extinguisher bottles are provided for fire fighting in the FWD and AFT cargo compartments of the 747-8 aircraft?","a":"6","ref":"FCOM, VOL 2 747-8; 8.20.4"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"Which cross feed valves are controlled by Fuel System Management logic when setting T/O flaps?","a":"Crossfeed valves 2 and 3","ref":"FCOM, VOL 2; 12.20.13"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"What is the impact on the aircraft with excessive fuel imbalance?","a":"Adversely affects CG\n  Aerodynamic drag\n  Fuel economy","ref":"FCOM, VOL 2; 12.20.3"},{"sec":"Fuel System","topic":"FUEL SYSTEM","q":"Describe how the fuel quantity indication  changes upon termination of fuel jettison:","a":"The fuel to remain quantity indication changes\n   from magenta to white. \n The fuel to remain quantity flashes for 5\n   seconds","ref":"FCOM, VOL 2; 12.20.17"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"What is the function of the LOWER LOBE  CARGO CONDITIONED AIR FLOW RATE Selector?","a":"Provides forward and aft cargo lobe conditioned air","ref":"FCOM, VOL 2; 2.20.7"},{"sec":"Air Systems","topic":"ANTI‐ICE/WINDOW HEAT","q":"How many angle of attack probes are provided, and when are they heated?","a":"2 angle of attack probes\nElectrically heated when any engine is operating.","ref":"FCOM, VOL 2; 3.20.3"},{"sec":"Air Systems","topic":"EQUIPMENT COOLING","q":"Equipment cooling provides cooling air for  what compartment and systems?","a":"Flight deck equipment\nElectrical and equipment racks (E & E)","ref":"FCOM, VOL 2; 2.20.14"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"The 747-8 ECS Left and Right trim air is provided to which temperature zones?","a":"Left trim air system\nflight deck\nupper deck\ncrew rest\naft Main deck\n\nRight trim air system\nforward main deck\nforward lower lobe\naft lower lobe","ref":"FCOM, VOL 2 747-8; 2.20.6"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"ON the 747-8, what position is the LOWER LOBE AFT CARGO HT selectors normally placed in during preflight?","a":"LOW","ref":"FCOM, VOL 2 747-8; 2.20.7"},{"sec":"Air Systems","topic":"AIR CONDITIONING","q":"ON the 747-8, what position are the MAIN DECK FWD and AFT TEMP selectors normally placed in during preflight?","a":"OFF","ref":"FCOM, VOL 2 747-8; 2.20.7"},{"sec":"Air Systems","topic":"ENGINE BLEED AIR SYSTEM","q":"Describe the general function of pressure regulating valve (PRV):","a":"Prevents damage to ducting and equipment downstream by limiting bleed air pressure.","ref":"FCOM, VOL 2; 2.40.1"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How do you re‐engage the autothrottles when the pitch mode is\nVNAV ___ or FLCH SPD?","a":"Cycle the A/T ARM switch to OFF and back to ARM","ref":"FCOM, VOL 2; 4.10.3"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"How can you de‐select the approach mode AFTER localizer and glide‐slope captured?","a":"Select TO/GA or Disengage autopilot and position both F/D switches off.","ref":"FCOM, VOL 2; 4.10.16"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"When is TO/GA mode terminated after  takeoff?","a":"By selecting any other pitch and roll mode, or by \tactivation of LNAV/VNAV modes","ref":"FCOM, VOL 2; 4.20.10"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"What climb rate is achieved during a go-around with one push of the TO/GA switches?","a":"2,000 feet per minute of climb","ref":"FCOM, VOL 2; 4.20.14"},{"sec":"Auto Flt. & Flt Inst.","topic":"AUTOMATIC FLIGHT/MCP","q":"What is the maximum intercept angle that the localizer (LOC) will capture with the Approach (APP) or LOC mode armed?","a":"Less than 120 degrees","ref":"FCOM, VOL 2; 4.20.11"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"What indicates you are 1/3 of a dot deviation from the Localizer?","a":"The Localizer pointer is just touching the rectangle during  \n      expanded localizer deviation scale.\nAt low radio altitudes, with autopilot or FD engaged, scale turns amber and flashes to indicate excessive LOC deviation","ref":"FCOM, VOL 1; SP.4.7/VOL 2; 10.10.19"},{"sec":"Flt Inst.","topic":"FLIGHT INSTRUMENTS & DISPLAYS","q":"747-8, Electronic Checklist Open Loop action items require __?","a":"flight crew to manually \n      confirm completion with \n      Cursor Control\nCURSOR\nCONTROL\nParking brake . . . . . . . . . . . . . . . . . . . . . . . . .  . . Set\nFuel control switches . . . . . . . . . . . . . . . . .  CUTOFF\nNORMAL\nITEM \nOVRD\nCHKL \nOVRD\nCHKL \nRESET","ref":"FCOM, VOL 2 747-8; 10.40.20"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What CDU pages are available during Alternate Navigation?","a":"Alternate navigation LEGS\nAlternate navigation PROGRESS\nAlternate navigation RADIO","ref":"FCOM, VOL 2; 11.50.2"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"What could happen if you advance the thrust levers  further then TO 1 or TO 2 fixed derate following an engine failure?","a":"Loss of directional control","ref":"FCOM, VOL 2; 11.32.3"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"If you are flying an approach with the FMC in “on approach” logic, and the airplane rises more than 150 feet above the path, the  FMA pitch mode will change from VNAV PTH to what pitch mode  display?","a":"VNAV SPD","ref":"FCOM, VOL 2; 11.31.29"},{"sec":"Navigation","topic":"FLIGHT MANAGEMENT SYSTEM (FMS)","q":"On the 747-8, does the MultiScan weather radar provide turbulence detection capability?","a":"Yes – Displays magenta for moderate to severe turbulence when there is sufficient precipitation (Clear air turbulence cannot be sensed by the radar)","ref":"FCOM, VOL 2; 11.31.3"},{"sec":"Flight Controls","topic":"FLAPS","q":"How many groups of leading flaps are provided, and how are they normally powered?","a":"Three groups on each wing: outboard, midspan, and inboard sections.\n  Normally pneumatically powered from the bleed air duct.","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLAPS","q":"How are the trailing edge flaps driven in  primary mode?","a":"Hydraulically","ref":"FCOM, VOL 2; 9.20.13"},{"sec":"Flight Controls","topic":"FLIGHT CONTROLS","q":"Takeoff trim setting is calculated based on__?","a":"FMC calculated:\ngross weight\ncenter of gravity\ntakeoff thrust derate selection\ntakeoff flap selection","ref":"FCOM, VOL 2; 9.20.4, 747-8, 9.20.5"},{"sec":"Flight Controls","topic":"FLAPS","q":"Is there any asymmetry protection in  alternate flap mode?","a":"NO\nThe FCU provide asymmetry protection in normal mode.","ref":"FCOM, VOL 2; 9.20.14"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What does the BRAKE SOURCE amber light indicate when illuminated?","a":"Active brake hydraulic sources (hydraulic systems 4, 1, and 2) have low pressure","ref":"FCOM, VOL 2; 14.10.5"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What conditions must be satisfied in order for the landing gear lever lock to release?","a":"Main gear are tilted\n  Body gear centered","ref":"FCOM, VOL 2; 14.20.2"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"What value on the brake \ntemperature monitoring system \ncauses the BRAKE TEMP Advisory \nEICAS message to appear?","a":"5","ref":"FCOM, VOL 2; 14.30.2"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"Describe the OFF position of the landing gear.","a":"Landing gear hydraulic system is depressurized.","ref":"FCOM, VOL 2; 14.10.1"},{"sec":"Landing Gear","topic":"LANDING GEAR & BRAKES","q":"Why is it necessary to pressurize hydraulic system 4 before pressurizing the other  systems?","a":"Precludes the transfer of hydraulic fluid from system 1 or 2 into system 4. When the parking brake is set, and then released, brake hydraulic return lines dump into system 4.","ref":"FCOM, VOL 2; 14.20.6"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"Can warning messages be canceled by pushing the CANC switch?","a":"No","ref":"FCOM, VOL 2; 15.10.1"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"Can amber alert messages be canceled or recalled?","a":"Yes, by pushing the CANC switch or the RCL switch.","ref":"FCOM, VOL 2; 15.10.1"},{"sec":"Warning Systems","topic":"WARNING SYSTEMS","q":"What is the highest priority alert message?","a":"Warning messages (red)","ref":"FCOM, VOL 2; 15.10.1"},{"sec":"Warning Systems","topic":"FOM","q":"Safety is best defined as __?","a":"Managed Risk\nThis acknowledges that “zero risk” is an impossibility but striving for it is not","ref":"FOM, 1.1.1"},{"sec":"Warning Systems","topic":"FOM","q":"When faced with competing objectives, what must always remain the highest priority?","a":"SAFETY","ref":"FOM, 1.1.2"}]}];

/* ============================================================ grading engine */
function waiverLock(s,p){
  const c = CAT(s.setup.cat);
  if (c.noW) return `${c.noW} — waivers not permitted`;
  if (s.setup.failedQual[p]) return "Following failure of a qualification event — waivers not permitted";
  if (s.setup.lapsed[p]) return "Recurrent PC interval expired (lapsed) — waivers not permitted";
  return "";
}
function stallNeed(code){ return code === "R" ? ["to","ldg","clean"] : ["to"]; }
function pcwuOf(s,p){ return s.kind === "PC" ? s.setup.link[p] : null; }

/* requirement + credit for one PC item */
function req(s,p,n){
  const it = IT(n), duty = s.setup.pilots[p].duty;
  if (n === 31 && duty !== "CA") return {code:"/", na:true, why:"Captain seat-specific item; not applicable to an FO"};
  let code = baseCode(n, s.setup.cat), lock = "", why = CODE_LABEL[code];
  const L = waiverLock(s,p);
  if (L && (code === "W" || code === "T")) { lock = L; code = "R"; why = L; }
  const link = pcwuOf(s,p);
  let credited = false, cwhy = "";
  if (link && (it.cred || it.naf)) {
    const pw = (link.items||{})[n] || {};
    if (it.naf && pw.st === "C") { credited = true; cwhy = `Completed (C) on PCWU ${link.date}`; }
    else if (it.cred && pw.st === "S" && link.role === "SCP") {
      if (n === 21) { const need = stallNeed(code); const have = pw.subs || {}; if (need.every(k => have[k])) { credited = true; cwhy = `Stall credited — S on PCWU ${link.date} by SCP`; } else cwhy = `PCWU stalls don’t cover ${need.filter(k=>!have[k]).map(k=>({to:"T/O",ldg:"LDG",clean:"Clean"})[k]).join(", ")} — grade on PC`; }
      else { credited = true; cwhy = `S on PCWU ${link.date} by SCP ${link.conductor||""}`.trim(); }
    } else if (it.cred && link.role !== "SCP") cwhy = "PCWU given by an instructor — not creditable (Check Airman only)";
  }
  return {code, lock, why, credited, cwhy, waivable: code === "W" || code === "T"};
}
/* allowed PC status entries */
function allowed(s,p,n){
  const it = IT(n), r = req(s,p,n);
  if (r.na) return ["/"];
  const slash = r.credited || r.code === "/";
  if (it.naf) return slash ? ["C","I","/"] : ["C","I"];
  const a = ["S","U"];
  if (r.code === "W") a.push("W");
  if (slash) a.push("/");
  return a;
}
/* effective status: explicit entry, else auto "/" when credited or not required */
function eff(s,p,n){
  const g = (s.g[p]||{})[n] || {};
  if (s.kind === "PCWU") return g.st || "";
  if (g.st) return g.st;
  const r = req(s,p,n);
  if (r.na || r.credited || r.code === "/") return "/";
  return "";
}
function isAuto(s,p,n){ const g = (s.g[p]||{})[n] || {}; return !g.st && !!eff(s,p,n); }

/* PCWU column rules */
function pcwuCell(s,p,n){ // returns {shaded, val, auto}
  const it = IT(n);
  if (!(it.cred || it.naf)) return {shaded:true, val:""};
  const g = (s.g[p]||{})[n] || {};
  if (n === 31 && s.setup.pilots[p].duty !== "CA") return {val:"/", auto:true, why:"FO — not applicable"};
  if (it.cred && s.setup.conductor.role !== "SCP") return {val:"/", auto:true, why:"Instructor PCWU — diagonal line; credit requires a Check Airman"};
  return {val:g.st || "", why:""};
}
function pcwuAllowed(s,p,n){ const it = IT(n); if (it.naf) return ["C","/"]; return ["S"]; }

/* problems that block submission */
function problems(s,p){
  const out = [], P = s.setup.pilots[p], who = pname(s,p);
  const add = (n,msg,warn) => out.push({n,msg,warn:!!warn});
  if (!P.name.trim() || !P.emp.trim()) add(0,"Pilot name and employee number");
  if (!s.setup.conductor.name.trim()) add(0, s.kind==="PC" ? "PC Check Airman name" : "PCWU instructor / Check Airman name");
  if (!s.setup.device.trim()) add(0,"Simulator FAA ID");
  if (s.kind === "PC") {
    const D = s.docs[p] || {}; const miss = DOCS.filter(d => !D[d[0]]);
    if (miss.length) add(0,`Documents not verified: ${miss.map(d=>d[1].split(" —")[0].split(" (")[0]).join("; ")}`);
    const res = s.debrief.p[p].result;
    if (!res) add(0,"Result not selected");
    const inc = res === "INC";
    if (!s.setup.link[p] && ["REC","RQF","RQ12"].includes(s.setup.cat)) add(0,"No PCWU linked — creditable and CAT II/III / Non-App F items will all be required on the PC", true);
    let anyU = false;
    ITEMS.forEach(it => {
      const n = it.n, r = req(s,p,n), v = eff(s,p,n), g = (s.g[p]||{})[n] || {};
      if (!v) { if (!inc) add(n, `${it.t}: no status entered — ${r.why}`); return; }
      if (v === "U" || v === "I") anyU = true;
      if (v === "/" && !r.na && !r.credited && r.code !== "/") add(n, `${it.t}: “/” not allowed — ${r.code==="*"||r.code==="N" ? "not credited from a PCWU" : "item is required"}`);
      if (v === "W" && r.code !== "W") add(n, `${it.t}: cannot be waived — ${r.lock || "no waiver authority for this item"}`);
      if (v === "W" && n === 9 && (P.duty === "FO" || s.setup.pilots[1-p].duty === "FO")) add(n, "RTO waived for an FO / FO pairing — confirm judgment standard applied (not automatic)", true);
      if (g.rep && !(g.note||"").trim() && !(s.debrief.p[p].remarks||"").trim()) add(n, `${it.t}: repeat code ${g.rep} needs a remark`);
      if ((v === "U" || v === "I") && !(g.note||"").trim() && !(s.debrief.p[p].remarks||"").trim()) add(n, `${it.t}: ${v} needs a remark${n===35?" naming the procedure":""}`);
      if (v === "S" && it.subs) {
        const sb = g.subs || {};
        if (n === 10 && !sb.dep && !sb.arr) add(n, "RNAV1: mark departure or arrival flown");
        if (n === 12 && !sb.man && !sb.auto) add(n, "Normal ILS: mark manual or autoland");
        if ((n === 14 || n === 15) && !sb.nrm && !sb.oei) add(n, `${n===14?"CAT II":"CAT III"}: mark normal or one engine inop`);
        if (n === 16 || n === 17) { if (!["VOR","NDB","LOC","ASR","RNAV"].some(k => sb[k])) add(n, `${it.t}: mark the approach type`); }
        if (n === 21) { const need = stallNeed(r.code); const miss = need.filter(k => !sb[k]); if (miss.length) add(n, `Approach to stall: ${miss.map(k=>({to:"T/O in turn",ldg:"LDG",clean:"Clean"})[k]).join(", ")} required for this PC`); }
      }
    });
    const a = ((s.g[p]||{})[16]||{}).subs||{}, b = ((s.g[p]||{})[17]||{}).subs||{};
    if (eff(s,p,16)==="S" && eff(s,p,17)==="S") {
      const ta = ["VOR","NDB","LOC","ASR","RNAV"].filter(k=>a[k]), tb = ["VOR","NDB","LOC","ASR","RNAV"].filter(k=>b[k]);
      if (ta.length && tb.length && ta.every(k => tb.includes(k)) && tb.every(k => ta.includes(k))) add(17, "Second non-precision must be a different type from the first");
      if (!a.man && !b.man) add(16, "One non-precision approach must be manually flown");
    }
    const c = s.counts[p]; if (!inc && (+c.to < 3 || +c.ldg < 3)) add(0,"TO / LDG count — 3 minimum each (3 manually flown landings)");
    if (res === "SAT" && anyU) add(0,"Result is Satisfactory but an item is graded U / I");
    if (res === "UNSAT" && !anyU) add(0,"Result is Unsat but no item is graded U / I", true);
  } else {
    const st = ((s.g[p]||{})[21]||{}); if (st.st === "S" && !(st.subs||{}).to) add(21,"Stall credited S without the T/O config stall in turn");
  }
  return out;
}
const blocking = (s,p) => problems(s,p).filter(x => !x.warn);
function seatRestricted(s,p){ return s.kind === "PC" && ITEMS.some(it => ["U","I"].includes(eff(s,p,it.n)) && !IT(it.n).naf); }

/* per-pilot status for a stick-diagram event */
function evState(s,e,p){
  if (s.kind === "PCWU") {
    const r = (((s.run.ev[e.id]||{}).p)||[])[p] || {};
    return r.st ? TSBY[r.st].c : (e.items.some(n => pcwuCell(s,p,n).val && !pcwuCell(s,p,n).auto) ? "ok" : "none");
  }
  const vs = e.items.map(n => ({v:eff(s,p,n), auto:isAuto(s,p,n), r:req(s,p,n)}));
  if (vs.some(x => x.v === "U" || x.v === "I")) return "bad";
  if (vs.every(x => x.v)) return vs.every(x => x.auto || x.v === "W") ? "mute" : "ok";
  if (vs.some(x => x.v && !x.auto)) return "warn";
  return "none";
}

  return [0,1].some(p => e.items.some(n => !eff(s,p,n)));
}

/* ============================================================ store */
const LOCAL_KEY = "ATLAS_NO_PC_SESSIONS_v1";
const store = {db:null, dl:null};
let sessions = {}, demo = null;
const ui = {view:"home", cur:null, ev:null, p:0, sel:null, del:null, oralTopic:"", linkFor:null};
try { Object.assign(sessions, JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}")); Object.values(sessions).forEach(migrate); } catch(e){}
const synced = new Set((() => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY+"_synced") || "[]"); } catch(e){ return []; } })());
function saveSynced(){ try { localStorage.setItem(LOCAL_KEY+"_synced", JSON.stringify([...synced])); } catch(e){} }
function cur(){ return ui.cur === "DEMO" ? demo : sessions[ui.cur]; }
function writeLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(sessions)); } catch(e){} }
const pending = {};
function touch(s){
  if (!s || s.demo) { renderStatus(); return; }
  s.updatedAt = Date.now(); writeLocal();
  clearTimeout(pending[s.id]); pending[s.id] = setTimeout(() => pushOne(s.id), 700);
  renderStatus("saving");
}
async function pushOne(id){
  const s = sessions[id]; if (!s) return;
  if (!store.db) { renderStatus(); return; }
  try { await store.db.doc("sessions/"+id).set(clone(s)); synced.add(id); saveSynced(); delete pending[id]; renderStatus(); }
  catch(e){
    if (e && e.code === "unavailable") setTimeout(() => pushOne(id), 1500 + Math.random()*1000);
    else { toast(e && e.code === "quota_exceeded" ? "The PC data store is full. Export and delete old sessions." : "Couldn't save to the PC data store. Kept on this device."); renderStatus("err"); }
  }
}
async function connectStore(){
  if (!window.claude || !claude.use) return;
  try { store.dl = await claude.use("downloads"); } catch(e){}
  let db = null; try { db = await claude.use("db"); } catch(e){}
  if (!db) { renderStatus(); return; }
  store.db = db; let first = true;
  db.collection("sessions").orderBy("updatedAt","desc").limit(500).onSnapshot(snap => {
    const seen = {};
    snap.docs.forEach(d => { const r = d.data(); if (!r || r.schema !== SCHEMA) return; seen[d.id] = r;
      const l = sessions[d.id]; if (!l || (r.updatedAt||0) > (l.updatedAt||0)) sessions[d.id] = migrate(clone(r)); });
    if (first && !snap.metadata.fromCache) { first = false;
      Object.keys(sessions).forEach(id => { if (seen[id]) { if (sessions[id].updatedAt > (seen[id].updatedAt||0)) pushOne(id); } else if (synced.has(id)) delete sessions[id]; else pushOne(id); }); }
    snap.docChanges().forEach(c => { if (c.type === "removed" && !pending[c.doc.id]) delete sessions[c.doc.id]; });
    writeLocal();
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { renderStatus(); return; }
    rerender();
  }, () => renderStatus("err"));
  rerender();
}
async function deleteSession(id){
  delete sessions[id]; writeLocal(); clearTimeout(pending[id]); delete pending[id];
  if (store.db) { try { await store.db.doc("sessions/"+id).delete(); } catch(e){ toast("Removed here; the data store could not be reached."); } }
}

/* PCWU lookup for a PC pilot */
function pcwuCandidates(s,p){
  const P = s.setup.pilots[p], emp = (P.emp||"").trim(), nm = (P.name||"").trim().toLowerCase();
  const out = [];
  Object.values(sessions).forEach(w => { if (w.kind !== "PCWU" || w.demo) return;
    w.setup.pilots.forEach((wp,i) => { const e = (wp.emp||"").trim(); const n = (wp.name||"").trim().toLowerCase();
      if ((emp && e === emp) || (!emp && nm && n === nm)) out.push({w, i}); }); });
  return out.sort((a,b) => (b.w.setup.date||"").localeCompare(a.w.setup.date||"") || b.w.updatedAt - a.w.updatedAt);
}
function snapPCWU(w,i){
  const items = {};
  ITEMS.forEach(it => { if (it.cred || it.naf) { const c = pcwuCell(w,i,it.n); const g = (w.g[i]||{})[it.n] || {}; items[it.n] = {st:c.val, subs:g.subs||{}}; } });
  return {sid:w.id, date:w.setup.date, device:w.setup.device, conductor:w.setup.conductor.name, condEmp:w.setup.conductor.emp, role:w.setup.conductor.role,
    pilot:w.setup.pilots[i].name, emp:w.setup.pilots[i].emp, idx:i, status:w.status, time:fmtHM(w.run.elapsed + (w.run.startedAt ? Date.now()-w.run.startedAt : 0)), items};
}

  w.setup.conductor = {name:"Sample SCP", emp:"00000", role:"SCP"};
  w.setup.pilots = [{...blankPilot("CA"), name:"Sample Captain", emp:"10001"}, {...blankPilot("FO"), name:"Sample First Officer", emp:"10002"}];
  [[9,"S"],[11,"S"],[14,"S"],[15,"S"],[20,"S"],[21,"S"],[24,"S"],[27,"C"],[29,"C"],[30,"C"],[31,"C"]].forEach(([n,v]) => { w.g[0][n] = {st:v}; });
  w.g[0][21].subs = {to:1}; w.g[0][14].subs = {oei:1}; w.g[0][15].subs = {nrm:1};
  [[9,"S"],[11,"S"],[20,"S"],[21,"S"],[27,"C"],[29,"C"],[30,"C"]].forEach(([n,v]) => { w.g[1][n] = {st:v}; });
  w.g[1][21].subs = {to:1,ldg:1}; w.g[1][24] = {st:"", note:"Sample: late go-around decision; train again on the PC."};
  w.status = "submitted"; w.run.elapsed = 4*3600*1000;
  const s = newSession("PC"); s.id = "DEMO"; s.demo = true;
  Object.assign(s.setup, {date:"2026-10-22", device:"FFS 747-400 #2 (FAA 584)", cat:"REC"});
  s.setup.conductor = {name:"Sample SCP", emp:"00000", role:"SCP"};
  s.setup.pilots = clone(w.setup.pilots);
  s.setup.link = [snapPCWU(w,0), snapPCWU(w,1)];
  s.docs[0] = Object.fromEntries(DOCS.map(d => [d[0],1]));
  [[1,"S"],[2,"S"],[3,"S"],[4,"S"],[5,"S"],[6,"S"],[7,"S"],[10,"S"],[37,"S"]].forEach(([n,v]) => { s.g[0][n] = {st:v}; s.g[1][n] = {st:v}; });
  s.g[0][10].subs = {dep:1}; s.g[1][10].subs = {dep:1};
  s.g[0][8] = {st:"S", rep:"B", note:"Sample: first attempt heading drifted 12° right; trained rudder and trim; repeat within ± 5°."};
  s.log[0].push({t:"0:52", m:"Item 8 unsatisfactory — recorded before training (B)"});
  s.counts = [{to:"2",ldg:"1"},{to:"2",ldg:"1"}];
  s.run.elapsed = 58*60*1000;
  return {w, s};
}

function linkBox(s,p){
  const L = s.setup.link[p], cands = pcwuCandidates(s,p);

  return `<div class="ios" style="margin-top:12px"><span class="eyebrow">PCWU record</span>
   ${L ? `<p style="margin:4px 0"><b>Linked:</b> PCWU ${esc(L.date)} · ${esc(L.device||"")} · ${esc(L.conductor||"—")} (${L.role==="SCP"?"SCP":"Instructor"}) · ${cnt} item${cnt===1?"":"s"} credited</p>

     <div class="row" style="margin-top:8px"><button class="btn small" data-act="unlink" data-p="${p}">Unlink</button>${cands.some(x=>x.w.id===L.sid && x.w.updatedAt) ? `<button class="btn small" data-act="relink" data-p="${p}">Refresh from PCWU</button>` : ""}</div>`
